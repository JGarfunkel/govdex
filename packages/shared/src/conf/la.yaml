# Louisiana locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in LA's own
# vocabulary and structure; notes below cover only what's LA-specific.
#
# LA uses "parish" instead of "county" — a direct county-equivalent, mapped
# onto the portable `county` code below. `educational_region` is
# intentionally absent: no BOCES-equivalent regional agency was confirmed.

profile:
  code: US-LA
  name: Louisiana
  config:
    judicial_regions: 42 # judicial districts (sources vary 40-43)
    athletic_sections: 9 # LHSAA classes/divisions (5A-1A plus Divisions I-IV for select/private schools)

concepts:
  state:
    local_name: Louisiana
    has_active_government: true
    default_body_name: State Legislature
    executive_title: Governor
    subdivisions: Parishes
    additional_subdivisions:
      major_cities: [New Orleans, Baton Rouge, Shreveport, Lafayette, Lake Charles]

  # traditional "Police Jury" is still used in 41 of 64 parishes; the other
  # 23 have home-rule charters (council-president, council-manager, or a
  # consolidated parish/city form). Many home-rule parishes elect a Parish
  # President as chief executive, separate from the council — East Baton
  # Rouge's consolidated city-parish government instead titles this officer
  # "Mayor-President"
  county:
    local_name: Parish
    has_active_government: true
    default_body_name: Police Jury
    executive_title: Parish President
    executive_required: false
    subdivisions: Cities, Towns, Villages
    legislative_committees: true
    committees_label: Committees

  # a real, distinct 3-tier legal system by population (city: 5,000+, town:
  # 1,000-4,999, village: under 1,000; minimum incorporation population 201)
  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    # Baton Rouge is a consolidated city-parish government (Mayor-President,
    # not modeled as a separate governance form here)
    governance: strong-mayor
    subdivisions: false

  town:
    local_name: Town
    has_active_government: true
    default_body_name: Town Council
    executive_title: Mayor
    executive_required: false
    legislative_committees: false

  village:
    local_name: Village
    has_active_government: true
    default_body_name: Village Council
    executive_required: false
    legislative_committees: false

  # governed by an elected Parish School Board; a few independent city
  # districts exist too (e.g. Bogalusa)
  school_district:
    local_name: Parish School District
    has_active_government: true
    default_body_name: Parish School Board

  scholastic_athletic_region:
    local_name: Class
    parent_org_name: LHSAA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    status: no live LADOTD-native source confirmed (giswebnew.dotd.la.gov was
      unreachable this session — may be a transient block, worth a retry)
    fallback: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1
      (Census TIGERweb, filter STATE='22') — verified 64 parishes.

  municipalities:
    url: https://data-ladotd.opendata.arcgis.com/datasets/LADOTD::municipal-boundaries
    provider: Louisiana DOTD Open Data (ETL'd from Census + LADOTD)
    type: ArcGIS/Esri Hub, geojson download
    field_mapping:
      PlaceNameShort (or PlaceNameFull): name — the suffix ("village"/"city")
        carries the legal class directly, e.g. "Morganza village"
      PlaceFIPS / GEOID: jurisdiction_identifiers (scheme "census_geoid")
      PlaceClassCode / PlaceClassCodeDescription: concept_id
      ParishName1 (through 5) / ParishFIPS1: parent parish (some places span multiple)
    note: verified 304 records.

  school_districts:
    status: no LDOE-hosted GIS/API found
    fallback: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/School/MapServer/0
      (Census TIGERweb, filter STATE='22') — verified 69 unified school districts.

  educational_region:
    status: confirmed none — Louisiana's closest analog is the state-run
      Special School District (a single statewide agency for special-needs/
      deaf/blind schools, not a regional shared-services confederation like
      BOCES).

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the
      parish FIPS from the counties source above.
