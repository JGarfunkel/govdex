# Pennsylvania locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in PA's own
# vocabulary and structure; notes below cover only what's PA-specific.
#
# PA's municipal landscape has no direct city/town/village equivalent to
# NY's — it's City / Borough / Township, three peer-level incorporated
# types (not one nested inside another). Mapped onto the portable codes as:
# `city` = City, `town` = Township (PA's real active general-purpose local
# government, headed by an elected Board of Supervisors/Commissioners, not a
# single executive), `village` = Borough (a genuine PA-specific incorporated
# category, roughly NY village's peer level, not a Township subdivision).

profile:
  code: US-PA
  name: Pennsylvania
  config:
    judicial_regions: 60 # judicial districts (Courts of Common Pleas) — most single-county, 7 pair two counties
    athletic_sections: 12 # PIAA districts
    school_districts: 29 # Intermediate Units (IUs)

concepts:
  state:
    local_name: Pennsylvania
    has_active_government: true
    default_body_name: General Assembly
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Philadelphia, Pittsburgh, Allentown, Erie, Reading, Scranton, Bethlehem, Lancaster]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of Commissioners
    executive_title: County Executive
    executive_required: false
    # only a few of the 8 home-rule counties (e.g. Lehigh, Northampton) have
    # an elected County Executive; the rest are run by the Board itself
    subdivisions: Cities, Townships, Boroughs
    legislative_committees: true
    committees_label: Committees

  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    governance: [strong-mayor, council-manager]
    governance_exceptions:
      strong-mayor: [Philadelphia, Pittsburgh]
    subdivisions: false

  town:
    local_name: Township
    has_active_government: true
    default_body_name: Board of Supervisors
    subdivisions: false

  village:
    local_name: Borough
    has_active_government: true
    default_body_name: Borough Council
    executive_title: Mayor
    executive_required: false
    governance: council-manager
    subdivisions: false

  # Philadelphia's first-class school district uses "Board of Public
  # Education" instead — a naming exception this profile doesn't model
  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of School Directors

  educational_region:
    local_name: Intermediate Unit
    local_abbrev: IU
    has_active_government: true
    default_body_name: IU Board

  scholastic_athletic_region:
    local_name: District
    parent_org_name: PIAA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://data.pa.gov/resource/2axz-wupj.json
    provider: PennDOT, via PA's open data portal (Socrata SODA API, same
      platform as NY's data.ny.gov) — dataset "PA County Boundaries Spatial
      Data Current Transportation"; also available as ArcGIS REST at
      https://mapservices.pasda.psu.edu/server/rest/services/pasda/PennDOT/MapServer/7
    type: Socrata SODA API (JSON/GeoJSON)
    field_mapping:
      county_nam: name
      fips_count: attributes.county_fips
      county_num (or pa_cty_cod): attributes.pa_county_code
      district_n: attributes.penndot_district
    note: verified 67 counties. No website field. A supplementary non-geo
      dataset at data.pa.gov/resource/44ch-j9ei.json carries county_name/
      state_fips_code/county_fips_code/fips_class_code for a lighter lookup.

  municipalities:
    url: https://data.pa.gov/resource/ednf-5bi6.json
    provider: same PA open data portal, dataset "PA Municipality Boundaries" —
      same source as PennDOT's "Pa Municipalities" ArcGIS layer
      (.../PennDOT/MapServer/10)
    type: Socrata SODA API (JSON/GeoJSON)
    field_mapping:
      mslink: jurisdiction_identifiers (scheme "pa_mslink")
      municipal1: name
      class_of_m: concept_id (township/borough/city class)
      county (or fips_count): parent county
      fips_mun_c: attributes.fips_municipality_code
      fips_mun_p: attributes.population_estimate
    note: verified ~2,560 municipalities. No website field. Multiple
      near-duplicate PA-Municipality-Boundary datasets exist on data.pa.gov
      (xfdy-ds3u, 9gre-k5zk) — ednf-5bi6 is the one confirmed returning live
      data; spot-check the others for currency before switching.

  school_districts:
    url: https://data.pa.gov/resource/sken-zr26.json
    provider: same PA open data portal, dataset "Pa School Districts" (also
      ArcGIS REST at PennDOT MapServer layer 11)
    type: Socrata SODA API (JSON/GeoJSON)
    field_mapping:
      school_dis (or school_nam): name
      aun_num (or aun_schdis): jurisdiction_identifiers (scheme "aun") — PA's BEDS-equivalent district identifier
      cty_name (or pa_cty_cod): parent county
      iu_num / iu_name: parent Intermediate Unit — see educational_region below
    note: verified ~500 districts. No website field.

  educational_region:
    status: no dedicated live source found
    note: unlike NY's BOCES (its own ArcGIS layer), PASDA/data.pa.gov has no
      standalone Intermediate Unit (IU) boundary or list API. PDE's EdNA
      entity directory (edna.pa.gov) is a live searchable directory including
      IUs with an Excel export, but no confirmed REST/JSON endpoint.
      Recommended approach — derive the 29 IUs from the school_districts
      dataset's iu_num/iu_name fields above (present on every district
      record) rather than treating anything here as a dedicated IU source.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS already captured by the counties source above.
