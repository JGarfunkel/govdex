# New York locale pack — the single authoritative source of NY vocabulary
# and governance rules. A second state ships its own <state-code>.yaml
# alongside this one, naming the same portable concepts
# (packages/db/seed/concepts.sql) its own way; nothing here is portable.
#
# This file feeds two different consumers, both derived from it rather than
# hand-maintained separately:
#   - the DB's `profiles` + `concept_profiles` rows (formerly hand-written
#     as packages/db/seed/profiles/us-ny.sql) are upserted straight from this
#     file by `npm run govdex:seed:us-ny`, which runs
#     ingestion/tools/seed-profile.ts. Edit this file and re-run that script;
#     there is no seed SQL file to keep in sync anymore.
#   - ingestion/tools/legistar-bodies.ts's chief-executive name matching
#     (CHIEF_EXECUTIVE_NAME) is built from each concept's `executive_title`
#     below, replacing what used to be a hardcoded regex.
# See packages/shared/src/conf/profile.ts for the loader and types.

profile:
  code: US-NY
  name: New York
  config:
    villages_exist: true
    judicial_regions: 13 # NY has 13 judicial districts
    athletic_sections: 11 # NYSPHSAA is divided into 11 sections
    school_districts: 37 # ~37 BOCES

# One entry per type_concepts.code (packages/db/seed/concepts.sql).
#
#   local_name / local_abbrev / parent_org_name -> concept_profiles columns
#   has_active_government -> drives body derivation (t04): true means "give
#     this a governing body". NY county government is active, so counties
#     get a legislature. Legislative/judicial/athletic regions are false:
#     they elect a member to a larger body rather than running a local
#     government of their own.
#   default_body_name -> the body t04 creates for a concept with an active
#     government.
#
#   executive_title -> the word(s) that name this concept's chief executive
#     (the body_categories.code='chief_executive' body — see
#     packages/shared/src/govCapabilities.ts and schema.sql's comment near
#     bodies.committees_url). Used by the spider/Legistar detectors to find
#     a candidate officeholder's name near this title in free text, and to
#     label the "Chief executive" section on the entity page. Only present
#     for concepts that elect/appoint one; omitted for concepts (districts,
#     regions) with no chief executive of their own.
#
#     Not every county has an elected County Executive — several smaller NY
#     counties are still run by a Board of Supervisors/County Legislature
#     chair instead. Finding no "County Executive" match on such a county's
#     site is an expected miss, not a detector bug: it means there is no
#     chief_executive-category body to name, only the legislative one.
#
#   legislative_committees / committees_label -> whether this concept's
#     governing body shows a "Committees" section on the entity page, and
#     what to label it (defaults to "Committees" if the label is omitted).
#     A fixed fact for county/town/village; for `city` it instead names
#     `governance` entries below, since NY cities split between strong-mayor
#     and council-manager forms.
#   governance -> which entry (or entries) under `governance` below applies,
#     for a concept whose committee behavior varies by governance form
#     rather than being a fixed fact of the concept itself. A concept naming
#     more than one (city: strong-mayor and council-manager both occur among
#     NY cities) has no single answer on its own — governance_exceptions
#     names the specific jurisdictions that use a non-default entry; a
#     jurisdiction named nowhere there falls back to the first entry, which
#     is still a guess until it's recorded here or picked in the UI.
concepts:
  state:
    local_name: New York State
    has_active_government: true
    default_body_name: State Legislature
    executive_title: Governor
    subdivisions: Counties
    # Extra sections pulling specific jurisdictions out of the main
    # `subdivisions` (Counties) list into their own section instead — keyed
    # by section id (humanized to a label: major_cities -> "Major Cities").
    # Names must match jurisdictions.name exactly (NYC is one whole city,
    # not a county, but is still a direct within-child of the state
    # alongside the counties — see ingestion/t01d-nyc/run.ts).
    additional_subdivisions:
      major_cities: [New York City, Buffalo, Yonkers, Rochester, Syracuse]

  county:
    local_name: County
    has_active_government: true
    default_body_name: County Legislature
    executive_title: County Executive
    executive_required: false
    subdivisions: Cities, Towns, Villages
    legislative_committees: true
    committees_label: Committees

  city:
    local_name: City
    has_active_government: true
    default_body_name: Common Council
    executive_title: Mayor
    governance: [strong-mayor, council-manager]
    governance_exceptions:
      strong-mayor: [New York City]
    subdivisions: false

  town:
    local_name: Town
    has_active_government: true
    default_body_name: Town Board
    executive_title: Supervisor
    governance: council-manager
    subdivisions: false

  village:
    local_name: Village
    has_active_government: true
    default_body_name: Board of Trustees
    executive_title: Mayor
    governance: council-manager
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Education

  educational_region:
    local_name: BOCES
    has_active_government: true
    default_body_name: BOCES Board

  scholastic_athletic_region:
    local_name: Section
    parent_org_name: NYSPHSAA
    has_active_government: false

  state_house_district:
    local_name: Assembly District
    local_abbrev: AD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    local_abbrev: JD
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

# Governance structures referenced by concepts.*.governance above.
# legislative_committees: whether a body under this governance type has
# standing committees worth a "Committees" section on the entity page.
# committees_label: what to call that section when it's shown (defaults to
# "Committees" if omitted).
governance:
  council-manager:
    chief_executive: false # the council-manager form does not have a separately elected chief executive
    legislative_committees: false
    legislative_districts: false

  # typically the larger cities
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment) — where
# each ingestion script actually pulls from, and how source fields map onto
# our schema, so the next state's script isn't written from scratch. One
# entry per ingestion step, named for what it loads rather than the script
# file (the script names/numbers shift; the sourcing rarely does).
sources:
  counties_municipalities:
    url: https://data.ny.gov/resource/55k6-h6qq.json
    provider: NY State Open Data (Socrata SODA API) — "Locality Hierarchy with Websites"
    script: ingestion/t01-jurisdictions/run.ts
    field_mapping:
      swis_code: jurisdiction_identifiers (scheme "swis")
      gnis_id: jurisdiction_identifiers (scheme "gnis")
      municipality (fallback county): name
      type_code: concept_id, via a 1=county/2=city/3=town/4=village map
      website.url: website
      county_fips, county_code, state_fips: attributes (JSONB)
    note: also creates NY's numbered AD/SD/CD/JD jurisdictions in the same
      run, from hardcoded apportionment counts rather than a source URL.
      NYC is a separate synthetic jurisdiction built by
      ingestion/t01d-nyc/run.ts from this same data (re-parents the 5
      borough rows under it; no external source of its own).

  school_districts:
    url: https://gisservices.its.ny.gov/arcgis/rest/services/NYS_Schools/MapServer/18
    provider: NYSED ArcGIS ("NYS_Schools" feature service, layer 18 = School Districts)
    script: ingestion/t01b-school-districts/run.ts
    field_mapping:
      INST_ID (12-digit BEDS code): jurisdiction_identifiers (scheme "beds")
      POPULAR_NA (title-cased): name
      SDLCODE: attributes.sed_district_code
    note: NYSED's SEDREF is the more "official" source but sits behind an
      authenticated COGNOS/OAM gateway — this ArcGIS layer was used
      instead as the live, unauthenticated equivalent.

  educational_region:
    url: https://gisservices.its.ny.gov/arcgis/rest/services/NYS_Schools/MapServer/17
    provider: NYSED ArcGIS (same feature service, layer 17 = BOCES), cross-checked
      against boces.org/regional-boces-directory/ for each BOCES's own website
    script: ingestion/t01c-boces/run.ts

  population:
    status: not yet ingested for any concept
    recommended_source: US Census Bureau Population Estimates Program (PEP)
      — https://api.census.gov/data/{year}/pep/population — county- and
      place-level, keyed by the same state/county FIPS codes t01 already
      captures in attributes, so it should join without a new identifier
      scheme. school districts would need the Small Area Income and
      Poverty Estimates (SAIPE) or ACS school-district tables instead — the
      PEP endpoint above doesn't cover them.
