# North Dakota locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in ND's own
# vocabulary and structure; notes below cover only what's ND-specific.

profile:
  code: US-ND
  name: North Dakota
  config:
    judicial_regions: 8 # judicial districts, within 4 administrative units
    athletic_sections: 2 # NDHSAA classes (A/B)
    school_districts: 7 # Regional Education Associations (REAs)

concepts:
  state:
    local_name: North Dakota
    has_active_government: true
    default_body_name: Legislative Assembly
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Fargo, Bismarck, Grand Forks, Minot]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of County Commissioners
    subdivisions: Cities
    legislative_committees: true
    committees_label: Committees

  # ND has no "town" or "village" category — every incorporated place is
  # legally a "city" regardless of size
  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    governance: [strong-mayor, council-manager]
    # Fargo/Bismarck/Mandan/Dickinson use a city-commission form (the
    # commission president is titled "mayor" but holds no separate power
    # from fellow commissioners) — grouped under council-manager here;
    # Minot is confirmed genuine council-manager
    governance_exceptions:
      council-manager: [Fargo, Bismarck, Mandan, Dickinson, Minot]
    subdivisions: false

  # active in most of the state's 53 counties; 5 (Billings, Dunn, Mercer,
  # Oliver, Stark) have none, with County Commissioners standing in
  town:
    local_name: Township
    has_active_government: true
    default_body_name: Township Board
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Education

  educational_region:
    local_name: Regional Education Association
    local_abbrev: REA
    has_active_government: true
    default_body_name: REA Board

  scholastic_athletic_region:
    local_name: Class
    parent_org_name: NDHSAA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://ndgishub.nd.gov/arcgis/rest/services/All_GovtBoundaries/MapServer/20
    provider: ND GIS Hub (state agencies)
    type: ArcGIS REST MapServer
    note: verified 53 counties, exact match. Same MapServer also carries
      Cities (layer 6), Civil Townships (layer 3), and School Districts
      (layer 33) — see below.

  municipalities:
    url: https://ndgishub.nd.gov/arcgis/rest/services/All_GovtBoundaries/MapServer/6
    provider: same ND GIS Hub service, layer "City Boundaries"
    type: ArcGIS REST MapServer
    field_mapping:
      CITY_NAME: name
      CITY_ID: jurisdiction_identifiers (scheme "nd_city_id")
      CNTY_SEAT: attributes.is_county_seat
    note: verified 356 records. Civil Townships are a separate layer (3),
      fields COUNTYFIPS/NAME.

  school_districts:
    url: https://ndgishub.nd.gov/arcgis/rest/services/All_GovtBoundaries/MapServer/33
    provider: same ND GIS Hub service
    type: ArcGIS REST MapServer
    field_mapping:
      (name field): name
      DistrictID / FIPSID: jurisdiction_identifiers (scheme "nd_district_id")
      CountyName: parent county
      NCESID: jurisdiction_identifiers (scheme "nces")
      REAStateID / REAName: parent Regional Education Association — see educational_region below
    note: verified 172 records. The REA assignment is embedded directly on
      each district record.

  educational_region:
    url: https://ndgishub.nd.gov/arcgis/rest/services/All_GovtBoundaries/MapServer/33
    provider: same school-districts layer — REAName field is the best
      structured proxy; ndrea.org (confirmed live) is the human directory
    field_mapping:
      REAName: name
    note: ndrea.org currently states 6 regional cooperatives (not the
      historical 7 — appears consolidated), serving 97% of ND public
      schools. No standalone GIS/API layer exists beyond the district-level
      REAName field.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
