# Massachusetts locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in MA's own
# vocabulary and structure; notes below cover only what's MA-specific.
#
# `judicial_region` and `scholastic_athletic_region`-as-a-region are the only
# two portable concepts with no clean MA equivalent (judicial: MA's Trial
# Court is organized into 7 subject-matter departments seated in counties/
# divisions, not numbered geographic districts) — `judicial_region` is
# omitted rather than forced into that shape; MIAA districts, by contrast,
# map fine (see scholastic_athletic_region below).

profile:
  code: US-MA
  name: Massachusetts
  config:
    villages_exist: false # "village" names an informal neighborhood within a town, not a separate incorporated government
    athletic_sections: 9 # MIAA District Athletic Committees (DACs)
    school_districts: 24 # Educational Collaboratives

concepts:
  state:
    local_name: Massachusetts
    has_active_government: true
    default_body_name: General Court
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Boston, Lowell, Worcester, Springfield]

  # county government was abolished in most of the state — 8 of 14 counties
  # have no government at all today. The 5 that retain one (Barnstable,
  # Bristol, Dukes, Norfolk, Plymouth) run only limited regional functions,
  # not a general-purpose government like NY's, so this profile treats
  # `county` as inactive statewide rather than modeling those exceptions.
  county:
    local_name: County
    has_active_government: false
    subdivisions: false

  # a handful of municipalities keep "Town" in their name after adopting a
  # City (council) form of government — the name doesn't indicate legal form
  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    governance: [strong-mayor, council-manager]
    governance_exceptions:
      strong-mayor: [Boston]
    subdivisions: false

  # governed by Town Meeting (the legislative body itself) with a Select
  # Board handling affairs between meetings — a board, not a single elected
  # chief executive, so `executive_title` is omitted here as it is for NY's
  # region-only concepts with no chief executive of their own
  town:
    local_name: Town
    has_active_government: true
    default_body_name: Town Meeting
    governance: town-meeting
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: School Committee

  educational_region:
    local_name: Educational Collaborative
    has_active_government: true
    default_body_name: Collaborative Board

  scholastic_athletic_region:
    local_name: District Athletic Committee
    local_abbrev: DAC
    parent_org_name: MIAA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  # a separately elected mayor with real executive power distinct from the
  # council — Boston is the confirmed MA example; other MA cities likely use
  # this form too but aren't confirmed by name yet
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

  council-manager:
    legislative_committees: false
    legislative_districts: false

  town-meeting:
    legislative_committees: false
    legislative_districts: false

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://services1.arcgis.com/hGdibHYSPO59RG1h/arcgis/rest/services/CountiesSurveyGenCoast_gdb/FeatureServer/1
    provider: MassGIS
    type: ArcGIS REST FeatureServer (layer 1 is the polygon layer; layer 0
      is a line-only outline layer — skip it)
    field_mapping:
      COUNTY: name
      FIPS_STCO: attributes.county_fips
    note: verified 14 counties, exact match.

  municipalities:
    url: https://arcgisserver.digital.mass.gov/arcgisserver/rest/services/AGOL/Census2020_Towns/FeatureServer/2
    provider: MassGIS, "Census2020_Towns" (layer 2 = polygon; layer 1 = lines)
    type: ArcGIS REST FeatureServer
    field_mapping:
      NAMELSAD20 (or TOWN20): name
      COUNTYFP20 (or COUNTY20): parent county
      GEOID20: jurisdiction_identifiers (scheme "census_geoid")
      POP2020: attributes.population_estimate (see population below)
    note: verified 351 records, matches MA's known total. Updated Feb 2026
      per metadata.

  school_districts:
    url: https://arcgisserver.digital.mass.gov/arcgisserver/rest/services/AGOL/Public_School_Districts/FeatureServer/0
    provider: same MassGIS host
    type: ArcGIS REST FeatureServer
    field_mapping:
      DISTRICT_NAME: name
      ORG4CODE / ORG8CODE: jurisdiction_identifiers (scheme "ma_orgcode")
      DISTRICT_TYPE: concept_id (e.g. ReglK12)
      SUPERINTENDENCY_UNION: parent grouping (a few districts share a
        superintendent across towns)
    note: verified 213 records. Metadata says the geometry vintage is "as
      of Dec 2, 2014" — the service itself is live, but treat currency as
      needing a check before production use.

  educational_region:
    status: no API or GIS layer — directory only
    note: 24 Educational Collaboratives confirmed live via
      moecnet.org/collaboratives/ (ACCEPT, Assabet Valley, Bi-County, CASE,
      CAPS, Cape Cod, Central Mass, CES, Crest, Keystone, LABBB, LPVEC,
      North River, Northshore, Pilgrim Area, READS, SEEM, Shore, South
      Coast, South Shore, SMEC, SWCEC, TEC, Valley) — HTML directory only,
      no downloadable dataset.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above. The municipalities source's own
      POP2020 field works as a quicker fallback.
