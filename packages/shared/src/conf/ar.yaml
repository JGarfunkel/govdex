# Arkansas locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in AR's own
# vocabulary and structure; notes below cover only what's AR-specific.

profile:
  code: US-AR
  name: Arkansas
  config:
    judicial_regions: 28 # judicial circuits/districts (23 numbered circuits, 5 of them split into two)
    athletic_sections: 7 # AAA classifications
    school_districts: 15 # Education Service Cooperatives

concepts:
  state:
    local_name: Arkansas
    has_active_government: true
    default_body_name: General Assembly
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Little Rock, Fort Smith, Fayetteville, Springdale, Jonesboro]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Quorum Court
    executive_title: County Judge
    executive_required: true
    subdivisions: Cities, Towns
    legislative_committees: true
    committees_label: Committees

  # a real, distinct legal category from `town` — split further into first-
  # class (2,500+) and second-class (500-2,500) cities; no "village" exists
  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    governance: [strong-mayor, council-manager]
    # Little Rock pairs an elected Mayor + Board of Directors with an
    # appointed City Manager (adopted 1993) — functionally council-manager
    governance_exceptions:
      council-manager: [Little Rock]
    subdivisions: false

  town:
    local_name: Town
    has_active_government: true
    default_body_name: Town Council
    executive_title: Mayor
    executive_required: false
    legislative_committees: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: School Board

  educational_region:
    local_name: Education Service Cooperative
    local_abbrev: ESC
    has_active_government: true
    default_body_name: ESC Board

  scholastic_athletic_region:
    local_name: Classification
    parent_org_name: AAA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial Circuit
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: http://gis.arkansas.gov/arcgis/rest/services/FEATURESERVICES/Boundaries/MapServer/48
    provider: Arkansas GIS Office, layer "COUNTY_BOUNDARY"
    type: ArcGIS REST MapServer
    note: verified 75 counties, exact match.

  municipalities:
    url: https://gis.arkansas.gov/arcgis/rest/services/FEATURESERVICES/Boundaries/FeatureServer/41
    provider: same AR GIS Office host, layer "MUNICIPAL_BOUNDARY"
    type: ArcGIS REST FeatureServer
    field_mapping:
      city_name: name
      city_fips: jurisdiction_identifiers (scheme "census_geoid")
      classification: concept_id — likely carries the first-class/
        second-class/incorporated-town tier, values not individually sampled
      pop2020: attributes.population_estimate (see population below)
    note: verified 501 records, matches ~500.

  school_districts:
    url: https://gis.arkansas.gov/arcgis/rest/services/FEATURESERVICES/Boundaries/FeatureServer/29
    provider: same host, layer "PUB_SCHOOL_DISTRICTS", jointly published by
      AR Dept of Education + AR GIS Office
    type: ArcGIS REST FeatureServer
    field_mapping:
      NAME: name
      LEA: jurisdiction_identifiers (scheme "ar_lea")
      UNIFIED: concept_id
    note: verified 238 records (vs. ~230 expected — plausibly includes
      special/vocational districts).

  educational_region:
    url: https://gis.arkansas.gov/arcgis/rest/services/FEATURESERVICES/Boundaries/FeatureServer/10
    provider: same host, layer for the 15 Education Service Cooperatives
      (1985 Act)
    type: ArcGIS REST FeatureServer
    field_mapping:
      Coop: name
      Number: identifier
    note: verified 16 polygon features (15 coops + Pulaski County, which
      operates outside the coop system). Non-GIS roster confirming all 15 by
      name/LEA#/director/district counts, at adedata.arkansas.gov/ARK12/coop
      (static HTML table, live, not an API).

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above. The municipalities source's own
      `pop2020`/`pop2010`/`pop2000` fields work as a quicker fallback.
