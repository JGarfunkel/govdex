# Mississippi locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in MS's own
# vocabulary and structure; notes below cover only what's MS-specific.
#
# `educational_region` is intentionally absent: no BOCES-equivalent regional
# education agency was found for Mississippi.

profile:
  code: US-MS
  name: Mississippi
  config:
    judicial_regions: 23 # Circuit Court districts (a separate 20-district Chancery Court layer also exists)
    athletic_sections: 7 # MHSAA classifications

concepts:
  state:
    local_name: Mississippi
    has_active_government: true
    default_body_name: Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Jackson, Gulfport, Southaven, Hattiesburg, Biloxi]

  # 5 members elected from districts locally called "beats"; the board
  # elects its own president — no separately elected chief executive
  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of Supervisors
    subdivisions: Cities, Towns, Villages
    legislative_committees: true
    committees_label: Committees

  # a real, distinct 3-tier legal system by population (city: 2,000+, town:
  # 300-1,999, village: 100-299) — no new villages may incorporate, but
  # existing ones remain legally valid
  city:
    local_name: City
    has_active_government: true
    default_body_name: Board of Aldermen
    executive_title: Mayor
    governance: strong-mayor
    subdivisions: false

  town:
    local_name: Town
    has_active_government: true
    default_body_name: Board of Aldermen
    executive_title: Mayor
    executive_required: false
    legislative_committees: false

  village:
    local_name: Village
    has_active_government: true
    default_body_name: Board of Aldermen
    executive_required: false
    legislative_committees: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Education

  scholastic_athletic_region:
    local_name: Classification
    parent_org_name: MHSAA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Circuit Court District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: http://www.gisonline.ms.gov/arcgis/rest/services/MDEQ/OpenData/MapServer/15
    provider: State of Mississippi enterprise GIS
    type: ArcGIS REST MapServer — this is actually a national US-counties
      reference layer mounted on MS's server (unfiltered count 3,141); query
      WHERE STATE_NAME='Mississippi' to scope it
    field_mapping:
      NAME: name
      CNTY_FIPS (or FIPS): attributes.county_fips
    note: verified 82 counties once filtered, exact match.

  municipalities:
    url: http://www.gisonline.ms.gov/arcgis/rest/services/MDEQ/OpenData/MapServer/51
    provider: same enterprise GIS host, layer "Cities and Towns (Boundaries)"
    type: ArcGIS REST MapServer
    field_mapping:
      PLACE_NAME: name
      PLACE_FIPSCODE: jurisdiction_identifiers (scheme "census_geoid")
      GNIS_ID: jurisdiction_identifiers (scheme "gnis")
    note: filtered to MS returns 329, vs. ~298 actual municipalities — this
      is Census "populated places" (incorporated places + unincorporated
      CDPs combined), with no field for city/town/village legal tier. No
      live MS-specific source (MARIS or Secretary of State) carrying the
      legal classification was found — flagged as a real gap.

  school_districts:
    status: no live MS-specific school-district GIS layer found (MARIS's own
      page 404'd; www.maris.state.ms.us doesn't resolve via DNS)
    fallback: https://services1.arcgis.com/Ua5sjt3LWTPigjyD/arcgis/rest/services/School_Districts_Current/FeatureServer/0
      (national NCES EDGE layer, filter STATEFP='28') — verified 137
      districts, close match to ~138.

  educational_region:
    status: confirmed to exist but no GIS/API — directory/PD site only
    note: 6 regional consortia (DAAIS, EMCED, GCEIC, NMEC, SMEC, SRESA),
      MDE-coordinated, hub at msresaservices.com — an events/PD calendar
      site with no boundary layer, directory API, or structured dataset.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
