# Connecticut locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in CT's own
# vocabulary and structure; notes below cover only what's CT-specific.
#
# `scholastic_athletic_region` is intentionally absent: CIAC classifies
# schools into size-based classes per sport rather than geographic sections,
# so there's no regional jurisdiction to seed.

profile:
  code: US-CT
  name: Connecticut
  config:
    villages_exist: false
    judicial_regions: 13 # Judicial Districts (a finer 20-way Geographical Area layer handles arraignments/misdemeanors below this)
    school_districts: 6 # Regional Educational Service Centers (RESCs)

concepts:
  state:
    local_name: Connecticut
    has_active_government: true
    default_body_name: General Assembly
    executive_title: Governor
    subdivisions: Towns
    additional_subdivisions:
      major_cities: [Bridgeport, New Haven, Stamford, Hartford, Waterbury, Norwalk]

  # county government was abolished statewide in 1960 (Public Act 152) — CT's
  # 8 counties are purely geographic/statistical labels today (judicial
  # districting, Census reporting), with no elected officials or budget
  county:
    local_name: County
    has_active_government: false
    subdivisions: false

  # CT's 169 towns are the universal, all-covering municipal unit — no
  # unincorporated territory exists outside one. Some towns are also
  # chartered as cities (often coterminous, e.g. Hartford, New Haven) with a
  # Mayor-Council or Council-Manager form instead of the traditional
  # Selectmen/Town Meeting model, so `town` (not `city`) is the concept that
  # carries CT's municipal government, with the charter form varying by
  # `governance`. `village` is absent: not a distinct incorporated category.
  town:
    local_name: Town
    has_active_government: true
    default_body_name: Board of Selectmen
    executive_title: First Selectman
    executive_required: false
    governance: [selectmen-town-meeting, strong-mayor, council-manager]
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Education

  educational_region:
    local_name: Regional Educational Service Center
    local_abbrev: RESC
    has_active_government: true
    default_body_name: RESC Board

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  # the traditional/default form absent a charter (~56 towns), and still
  # common alongside a Representative Town Meeting variant elsewhere
  selectmen-town-meeting:
    legislative_committees: false
    legislative_districts: false

  # a separately elected mayor with real executive power distinct from the
  # council — a charter-adopted form, more common where a town also holds a
  # city charter (e.g. Hartford, New Haven)
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

  council-manager:
    legislative_committees: false
    legislative_districts: false

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://services3.arcgis.com/3FL1kr7L4LvwA2Kb/arcgis/rest/services/CT_Counties/FeatureServer/0
    provider: CT DEEP GIS, "CT Counties"
    type: ArcGIS REST FeatureServer
    field_mapping:
      County: name
      CountyFIPS (or CountyFIPS_GEOID): attributes.county_fips
    note: verified 8, exact match. Item description explicitly states
      counties are legacy/statistical, superseded by 9 Planning Regions —
      consistent with this file's has_active_government=false.

  town:
    url: https://services1.arcgis.com/FjPcSmEFuDYlIdKC/arcgis/rest/services/Connecticut_Town_Index/FeatureServer/0
    provider: CT DEEP GIS, "Connecticut Town Index" — CT's real municipal
      unit (see this file's town concept)
    type: ArcGIS REST FeatureServer
    field_mapping:
      TOWN: name
      TOWN_NO: jurisdiction_identifiers (scheme "ct_town_no")
    note: verified 169, exact match. No field flags which towns also hold a
      city charter (e.g. Hartford, New Haven, Bridgeport) — that
      distinction wasn't found in any live CT GIS source.

  school_districts:
    url: https://data.ct.gov/resource/9k2y-kqxn.json
    provider: CT State Dept of Education (SDE), "Education Directory"
    type: Socrata SODA API — a school-level roster, not district polygons
    field_mapping:
      district_name: name
      organization_code: jurisdiction_identifiers (scheme "ct_org_code")
      town: parent town
      organization_type: concept_id — distinguishes "Public Schools" from
        "Regional Education Service Center Schools"
    note: verified 207 distinct district names via a SoQL count query
      (matches ~200 stated).

  educational_region:
    status: no unified API/dataset — directory only
    note: 6 RESCs (ACES, CREC, CES, EASTCONN, EdAdvance, LEARN) confirmed
      via rescalliance.org, aces.org/our-agency/about-aces/resc-alliance,
      and a static CT SDE PDF map
      (portal.ct.gov/-/media/sde/cte/resc_wdbmap.pdf) with directors/
      addresses — not queryable data. The school_districts source above
      does carry individual RESC-operated schools as rows.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population.
