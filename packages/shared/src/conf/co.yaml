# Colorado locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in CO's own
# vocabulary and structure; notes below cover only what's CO-specific.
#
# Denver and Broomfield are consolidated city-county governments — pulled
# out via `additional_subdivisions` below, the same technique ny.yaml uses
# for NYC. `scholastic_athletic_region` is intentionally absent: CHSAA
# organizes schools into leagues rather than a confirmed fixed set of
# classes/regions.

profile:
  code: US-CO
  name: Colorado
  config:
    judicial_regions: 23 # judicial districts (expanded from 22 in Jan 2025)
    school_districts: 20 # BOCES — approximate; a live authoritative count wasn't available this session

concepts:
  state:
    local_name: Colorado
    has_active_government: true
    default_body_name: General Assembly
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Colorado Springs, Aurora, Fort Collins, Lakewood, Thornton, Pueblo]
      consolidated_city_counties: [Denver, Broomfield]

  # county home rule (available since 1970) is rarer and more limited than
  # municipal home rule — only 2 home rule counties exist besides Denver
  # and Broomfield's consolidated city-county governments
  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of County Commissioners
    subdivisions: Municipalities
    legislative_committees: true
    committees_label: Committees

  # the legally load-bearing distinction in CO is home rule vs. statutory
  # (governed directly by CRS Title 31) rather than a city/town naming tier
  city:
    local_name: Municipality
    has_active_government: true
    default_body_name: City/Town Council
    executive_title: Mayor
    governance: [council-manager, strong-mayor]
    # Denver is also a consolidated city-county (see additional_subdivisions
    # above); Colorado Springs adopted strong-mayor by referendum in 2010
    governance_exceptions:
      strong-mayor: [Denver, Colorado Springs]
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Education

  # Colorado's regional agency is literally called "Board of Cooperative
  # Educational Services (BOCES)," same name and origin as NY's
  educational_region:
    local_name: Board of Cooperative Educational Services
    local_abbrev: BOCES
    has_active_government: true
    default_body_name: BOCES Board

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://services2.arcgis.com/fnCPHPvll1r80nFV/arcgis/rest/services/Colorado_Counties/FeatureServer/127
    provider: Colorado DOLA, sourced from US Census (2020 vintage)
    type: ArcGIS REST FeatureServer
    field_mapping:
      NAME20: name
      GEOID20: attributes.county_fips
      TOTALPOP: attributes.population_estimate (dated — see population below)
    note: verified 64 counties, exact match, including Denver and Broomfield
      as consolidated city-counties (identifiable by name).

  municipalities:
    url: https://services3.arcgis.com/DgjqnJA1rgO92Soi/arcgis/rest/services/DOLA_Municipalities_(Boundaries_Dissolved)/FeatureServer/0
    provider: Colorado DOLA (Dept of Local Affairs), official state account
    type: ArcGIS REST FeatureServer
    field_mapping:
      city (or first_city): name
    note: verified 274 records (close to ~272 expected). No field
      distinguishes home-rule vs. statutory status — this file's own
      governance-relevant distinction — which would need to be
      cross-referenced against DOLA's Local Government Information System
      (dola.colorado.gov/dlg_lgis_ui_pu/publicMunicipalities.jsf), a web UI
      with no confirmed machine-readable API. A sibling non-dissolved layer
      on the same server returns 1,911 (an annexation-history layer with
      many polygons per city) — use the dissolved layer above instead.

  school_districts:
    url: https://www.cohealthmaps.dphe.state.co.us/arcgis/rest/services/OPEN_DATA/cdphe_cdoe_colorado_schools_districts/MapServer/1
    provider: CDPHE/CDE (Colorado Dept of Education) collaboration; also
      mirrored on data-cdphe.opendata.arcgis.com
    type: ArcGIS REST MapServer
    note: verified 178 districts (close to ~180 expected).

  # Colorado's own BOCES, same name/origin as NY's
  educational_region:
    status: no machine-readable boundary/API layer found — directory only
    count: 21 per the Colorado BOCES Association (coloradoboces.org, which
      states "twenty-one (21) BOCES" and lists member BOCES); Wikipedia's
      "List of Colorado BOCES" claims 22 — an unresolved discrepancy, with
      the association's own figure treated as more authoritative. CDE's own
      district-maps page (cde.state.co.us) exists but wasn't confirmed to
      expose an API.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above. That source's own `TOTALPOP`
      field (2020 Census vintage) works as a quicker fallback.
