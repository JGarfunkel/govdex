# Utah locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in UT's own
# vocabulary and structure; notes below cover only what's UT-specific.
#
# `educational_region` and `scholastic_athletic_region` are intentionally
# absent: no BOCES-equivalent regional agency or confirmed UHSAA class
# structure was found this session. Utah's transitional "metro township"
# category (created 2015 for unincorporated Salt Lake County; its last 5
# converted to full cities in 2024) isn't modeled as its own concept.

profile:
  code: US-UT
  name: Utah
  config:
    judicial_regions: 8 # judicial districts

concepts:
  state:
    local_name: Utah
    has_active_government: true
    default_body_name: State Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Salt Lake City, West Valley City, Provo, West Jordan, Orem]

  county:
    local_name: County
    has_active_government: true
    default_body_name: County Commission
    executive_title: County Mayor
    executive_required: false
    # only 6 of 29 counties (Cache, Grand, Morgan, Wasatch, Salt Lake,
    # Summit) have opted into a County Council + elected County Mayor;
    # every other county keeps the default 3-member Commission
    subdivisions: Cities, Towns
    legislative_committees: true
    committees_label: Committees

  # a real, distinct legal category from `town` by population (town: under
  # 1,000; city: 1,000+)
  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    # Salt Lake City is confirmed strong mayor-council; Utah's own
    # municipal league describes council-manager as "rare" statewide —
    # unlike most of the Mountain West, mayor-council is UT's dominant form
    governance: strong-mayor
    subdivisions: false

  town:
    local_name: Town
    has_active_government: true
    default_body_name: Town Council
    executive_required: false
    legislative_committees: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Local School Board

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://services1.arcgis.com/99lidPhWCzftIe9K/ArcGIS/rest/services/UtahCountyBoundaries/FeatureServer/0
    provider: UGRC (Utah Geospatial Resource Center) / Utah SGID
    type: ArcGIS REST FeatureServer
    field_mapping:
      NAME: name
      FIPS: attributes.county_fips
      POP_CURRESTIMATE: attributes.population_estimate (see population below)
    note: verified 29 counties, exact match.

  municipalities:
    url: https://services1.arcgis.com/99lidPhWCzftIe9K/ArcGIS/rest/services/UtahMunicipalBoundaries/FeatureServer/0
    provider: same UGRC host
    type: ArcGIS REST FeatureServer
    field_mapping:
      NAME: name
      COUNTYNBR: parent county
      FIPS: jurisdiction_identifiers (scheme "census_geoid")
      GNIS: jurisdiction_identifiers (scheme "gnis")
    note: verified 261 records. No field explicitly labeled City/Town — UT's
      split is population-threshold-based (city >=1,000), so it's derivable
      from POPLASTCENSUS if not directly tagged (SHORTDESC may also carry it,
      unsampled).

  school_districts:
    url: https://services1.arcgis.com/99lidPhWCzftIe9K/ArcGIS/rest/services/UtahSchoolDistrictBoundaries/FeatureServer/0
    provider: Utah State Board of Education (USBE) + Lt. Governor's Office, certified
    type: ArcGIS REST FeatureServer
    note: verified 41 districts, exact match.

  educational_region:
    status: confirmed to exist but no GIS/API/directory found
    note: 4 Regional Education Service Agencies (CUES, NUES, SEDC, SESC —
      renamed from "Regional Service Centers" by 2020 SB0079, governed under
      Utah Admin Rule R277-706), rural-districts-only coverage (Wasatch
      Front urban districts aren't members).

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above; that source's own
      POP_CURRESTIMATE works as a quicker fallback.
