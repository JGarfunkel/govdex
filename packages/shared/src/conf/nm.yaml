# New Mexico locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in NM's own
# vocabulary and structure; notes below cover only what's NM-specific.
#
# `educational_region` config count is intentionally omitted: Regional
# Education Cooperatives don't tile the state one-per-region the way BOCES
# does, so no clean count exists.

profile:
  code: US-NM
  name: New Mexico
  config:
    judicial_regions: 13 # judicial districts, covering 33 counties

concepts:
  state:
    local_name: New Mexico
    has_active_government: true
    default_body_name: State Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Albuquerque, Las Cruces, Rio Rancho, Santa Fe, Roswell]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of County Commissioners
    executive_required: false
    subdivisions: Municipalities
    legislative_committees: true
    committees_label: Committees

  # NM statute treats "city," "town," and "village" as legally equivalent —
  # any incorporated place is just a "municipality," unlike NY
  city:
    local_name: Municipality
    has_active_government: true
    default_body_name: Governing Body
    executive_title: Mayor
    # Albuquerque is confirmed strong mayor-council; Santa Fe is confirmed
    # council-manager
    governance: [strong-mayor, council-manager]
    governance_exceptions:
      council-manager: [Santa Fe]
    subdivisions: false

  school_district:
    local_name: Local School District
    has_active_government: true
    default_body_name: Local School Board

  educational_region:
    local_name: Regional Education Cooperative
    local_abbrev: REC
    has_active_government: true
    default_body_name: REC Board

  scholastic_athletic_region:
    local_name: Classification
    parent_org_name: NMAA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://nmbbmapping.org/arcgis/rest/services/AdministrationBoundary/MapServer/0
    provider: New Mexico (Census 2020-sourced), layer "County Boundary"
    type: ArcGIS REST MapServer
    field_mapping:
      NAME20: name
      COUNTYFP20: attributes.county_fips
    note: verified 33 counties, exact match.

  municipalities:
    url: https://nmbbmapping.org/arcgis/rest/services/AdministrationBoundary/MapServer/3
    provider: same host, layer "Incorporated Place," sourced from NM
      Taxation & Revenue Dept (TRD) boundary revisions plus Census
    type: ArcGIS REST MapServer
    note: verified 111 records (vs. ~106 municipalities — TRD's layer may
      include a few extra/duplicate or non-standard entries; worth a
      field-level dedup check).

  school_districts:
    url: https://services.arcgis.com/LGtNQDlIZBdntoA9/arcgis/rest/services/tl_2020_35_unsd20/FeatureServer/0
    provider: 2020 TIGER unified school districts, hosted via RGIS's ArcGIS
      org — NM PED's own "School District Boundary GovDex" is cited as the
      underlying source in metadata, but no PED-hosted REST endpoint was found
    type: ArcGIS REST FeatureServer
    note: verified 89 districts, exact match.

  educational_region:
    status: confirmed to exist — directory, not API
    note: 10 Regional Education Cooperatives (RECs) confirmed via NMPED's
      directory (web.ped.nm.gov/rec-executive-directors-directory/) and the
      NM Regional Education Cooperatives Association (nmreca.org), REC-1
      through REC-10, each with its own site giving district membership. No
      consolidated API/GeoJSON found — ingestion would mean scraping/
      hand-encoding the 10 REC-to-district mappings.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
