# North Carolina locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in NC's own
# vocabulary and structure; notes below cover only what's NC-specific.
#
# `scholastic_athletic_region` uses "Classification" rather than a fixed
# region count: NCHSAA's East/West postseason split varies by cycle.

profile:
  code: US-NC
  name: North Carolina
  config:
    judicial_regions: 48 # Superior Court districts (a separate, 43-district District Court layer also exists below this)

concepts:
  state:
    local_name: North Carolina
    has_active_government: true
    default_body_name: General Assembly
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Charlotte, Raleigh, Greensboro, Durham, Winston-Salem, Fayetteville, Cary, Wilmington, Asheville]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of Commissioners
    executive_required: false
    # day-to-day administration is run by an appointed County Manager —
    # near-universal in NC, not a separately elected office
    subdivisions: Municipalities
    legislative_committees: true
    committees_label: Committees

  # NC statute (Ch. 160A) treats "city," "town," and "village" as legally
  # interchangeable — the charter name is unrelated to population or form
  city:
    local_name: Municipality
    has_active_government: true
    default_body_name: City/Town Council
    executive_title: Mayor
    # council-manager confirmed even in NC's largest cities (Charlotte,
    # Raleigh) — no confirmed strong-mayor exception found
    governance: council-manager
    subdivisions: false

  # 100 districts map to the 100 counties; 15 additional independent city
  # districts (e.g. Asheville City, Chapel Hill-Carrboro) sit inside a
  # county's boundaries but operate separately — all fiscally dependent on
  # their county's Board of Commissioners for tax levies
  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Education

  educational_region:
    local_name: Regional Education Service Alliance
    local_abbrev: RESA
    has_active_government: true
    default_body_name: RESA Board

  scholastic_athletic_region:
    local_name: Classification
    parent_org_name: NCHSAA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Superior Court District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://gis11.services.ncdot.gov/arcgis/rest/services/NCDOT_CountyBdy_Poly/MapServer/0
    provider: North Carolina DOT (NCDOT)
    type: ArcGIS REST MapServer
    note: verified 100 counties, exact match.

  municipalities:
    url: https://gis11.services.ncdot.gov/arcgis/rest/services/NCDOT_CityBdy_Poly/MapServer/0
    provider: same NCDOT host
    type: ArcGIS REST MapServer
    field_mapping:
      MunicipalBoundaryName: name
      CountyName1 (through 4): parent county (some municipalities span multiple)
      IncorporatedYear: attributes.incorporated_year
      CensusPopulation: attributes.population_estimate (see population below)
    note: verified 550 records, matches ~550. NCDOT_DistrictBdy_Poly on the
      same server (count=38) is NCDOT's own highway-maintenance districts —
      not school districts, don't confuse it with the source below.

  school_districts:
    url: https://services5.arcgis.com/mSDBiLWaIfH92NqI/arcgis/rest/services/LEA_Boundari_NC/FeatureServer/0
    provider: NC OneMap
    type: ArcGIS REST FeatureServer
    field_mapping:
      NAME: name
      LEA: jurisdiction_identifiers (scheme "nc_lea")
      COUNTYFP / STATEFP: parent county
    note: verified 115 records, exact match (100 county + 15 independent
      city districts). NC OneMap also hosts decoy layers with similar
      names — NC1Map_Regional_Boundaries (count=6,138) and
      SPM23_County_Boundary/County_2022 (count=21/26) are NOT this dataset;
      don't use them.

  educational_region:
    status: no API or GIS layer — directory only
    note: 8 RESAs/RALCs confirmed via dpi.nc.gov/about-dpi/education-directory/resa-ralc
      (Central Carolina, Northeast, Northwest, Piedmont-Triad, Sandhills,
      Southeast, Southwest, Western), listed with director names — static
      directory only.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above. The municipalities source's own
      CensusPopulation field works as a quicker fallback.
