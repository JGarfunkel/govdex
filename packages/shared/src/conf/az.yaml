# Arizona locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in AZ's own
# vocabulary and structure; notes below cover only what's AZ-specific.
#
# `judicial_region` is intentionally absent: AZ's Superior Court is
# organized purely by county (15 for 15) — no separate multi-county
# grouping to model.

profile:
  code: US-AZ
  name: Arizona
  config:
    athletic_sections: 6 # AIA conferences/classifications (6A-1A)

concepts:
  state:
    local_name: Arizona
    has_active_government: true
    default_body_name: State Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Phoenix, Tucson, Mesa, Chandler, Scottsdale, Glendale, Gilbert, Tempe]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of Supervisors
    subdivisions: Cities, Towns
    legislative_committees: true
    committees_label: Committees

  # a real, distinct legal category from `town` by population threshold
  # (town: 1,500+, city: 3,000+), though the two carry identical powers
  # once incorporated
  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    # Phoenix (the largest council-manager city in the US) and Tucson are
    # both confirmed council-manager; Mesa is the confirmed mayor-council
    # exception
    governance: [council-manager, strong-mayor]
    governance_exceptions:
      strong-mayor: [Mesa]
    subdivisions: false

  town:
    local_name: Town
    has_active_government: true
    default_body_name: Town Council
    executive_title: Mayor
    executive_required: false
    legislative_committees: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Governing Board

  scholastic_athletic_region:
    local_name: Conference
    parent_org_name: AIA
    has_active_government: false

  # AZ's 30 Legislative Districts are combined: each elects 2 House members
  # + 1 Senator under the same district number, rather than separately
  # numbered House/Senate districts
  state_house_district:
    local_name: Legislative District
    local_abbrev: LD
    has_active_government: false

  state_senate_district:
    local_name: Legislative District
    local_abbrev: LD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://azgeo.az.gov/arcgis/rest/services/asld/Counties/MapServer/0
    provider: Arizona State Land Dept (ASLD), via AZGeo
    type: ArcGIS REST MapServer
    note: verified 15 counties.

  municipalities:
    url: https://azgeo.az.gov/arcgis/rest/services/asld/Cities/FeatureServer/0
    provider: same ASLD/AZGeo source, updated quarterly
    type: ArcGIS REST FeatureServer
    note: verified 91 cities and towns combined, matching the expected total exactly.

  school_districts:
    url: https://services1.arcgis.com/Ua5sjt3LWTPigjyD/arcgis/rest/services/School_Districts_Current/FeatureServer/0
    provider: a nationwide hosted layer (sourced from Census TIGER via NCES
      SDRP), surfaced through AZGeo — filter STATEFP='04' for Arizona
    type: ArcGIS REST FeatureServer
    field_mapping:
      NAME: name
      GEOID: jurisdiction_identifiers (scheme "census_geoid")
      MTFCC: concept_id — G5400=elementary, G5410=secondary, G5420=unified
        (directly distinguishes AZ's non-coterminous elementary/high/unified districts)
    note: verified 216 districts for Arizona with the state filter applied.

  educational_region:
    status: none found — Arizona has no BOCES/ESD-equivalent regional education service agency

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS already captured by the counties source above.
