# Rhode Island locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in RI's own
# vocabulary and structure; notes below cover only what's RI-specific.
#
# `educational_region` and `scholastic_athletic_region` are intentionally
# absent: no BOCES-equivalent regional education agency was found, and RIIL
# has no confirmed geographic sub-regions.

profile:
  code: US-RI
  name: Rhode Island
  config:
    judicial_regions: 4 # District Court divisions (numbered non-sequentially: 2, 3, 4, 6 — historical)
    school_districts: 36 # 32 municipal (single-town/city) + 4 regional (multi-municipality) districts

concepts:
  state:
    local_name: Rhode Island
    has_active_government: true
    default_body_name: General Assembly
    executive_title: Governor
    subdivisions: Towns
    additional_subdivisions:
      major_cities: [Providence, Cranston, Warwick, Pawtucket]

  # abolished in 1846 — RI's 5 counties are purely geographic/judicial
  # labels today, with no elected officials or budget, same as Connecticut
  county:
    local_name: County
    has_active_government: false
    subdivisions: false

  # both `city` (8, re-incorporated by special legislative act, generally
  # with a stronger executive) and `town` (31, colonial-era incorporation)
  # are real, legally distinct categories in RI — unlike CT next door,
  # which folds everything into `town`
  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    governance: [council-manager, strong-mayor]
    governance_exceptions:
      strong-mayor: [Providence, Cranston, Warwick]
    subdivisions: false

  town:
    local_name: Town
    has_active_government: true
    default_body_name: Town Council
    governance: council-manager
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: School Committee

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: District Court Division
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://risegis.ri.gov/hosting/rest/services/Statewide/TownsCounties/MapServer/1
    provider: RIDOT MIS/GIS Section (RIGIS)
    type: ArcGIS REST MapServer
    note: verified — multiple disjoint polygons per county name, confirming
      RI's counties are purely geographic (no government), consistent with
      the note above.

  municipalities:
    url: https://risegis.ri.gov/hosting/rest/services/Statewide/TownsCounties/MapServer/2
    provider: same RIGIS host, layer "39 Towns"
    type: ArcGIS REST MapServer
    note: verified exactly 39, matching the 8 cities + 31 towns total precisely.

  school_districts:
    status: no RIDE or RIGIS live API/ArcGIS service found (checked all
      RIGIS service folders — E911, Hosted [token-gated], RIDEM, RIDOA,
      RIDOH, RIDOT, RIEMA, RISOS, Statewide, Utilities — none contain
      schools/districts)
    fallback: Census TIGER Unified School Districts for RI
      (www2.census.gov/geo/tiger/TIGER2024/UNSD/tl_2024_44_unsd.zip,
      confirmed present) — won't carry RIDE's own 32-municipal/4-regional
      administrative classification, which has no located machine-readable source.

  educational_region:
    status: confirmed none — no RIGIS/RIDE service layer or folder reflects
      any BOCES-equivalent overlay.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population.
