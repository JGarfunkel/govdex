# Nevada locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in NV's own
# vocabulary and structure; notes below cover only what's NV-specific.
#
# `village` doesn't exist, and `town` is repurposed: Nevada's "town" isn't
# a second incorporated municipal tier (NV's only incorporated category is
# `city`) — it names unincorporated communities (e.g. Paradise, Sunrise
# Manor) with a limited county-appointed/elected Town Advisory Board.
# Carson City is a consolidated independent city/county government, not
# separately modeled here (same simplification as other states' consolidated
# city-counties).

profile:
  code: US-NV
  name: Nevada
  config:
    judicial_regions: 11 # judicial districts, covering 16 counties + Carson City
    athletic_sections: 5 # NIAA classifications
    school_districts: 17 # 16 county-wide districts + Carson City's independent district

concepts:
  state:
    local_name: Nevada
    has_active_government: true
    default_body_name: State Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Las Vegas, Henderson, Reno, North Las Vegas, Sparks]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of County Commissioners
    subdivisions: Cities
    legislative_committees: true
    committees_label: Committees

  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    # Las Vegas, Henderson, and Reno are all confirmed council-manager
    governance: council-manager
    subdivisions: false

  town:
    local_name: Unincorporated Town
    has_active_government: true
    default_body_name: Town Advisory Board
    executive_required: false
    legislative_committees: false
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Trustees

  scholastic_athletic_region:
    local_name: Region
    parent_org_name: NIAA
    has_active_government: false

  # NV's lower chamber is the Assembly, not the House
  state_house_district:
    local_name: Assembly District
    local_abbrev: AD
    has_active_government: false

  # since 2012, each of the 21 Senate Districts splits into 2 Assembly
  # Districts — nested, not identical numbering (unlike AZ/ID)
  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://gis.dot.nv.gov/agsphs/rest/services/State_of_Nevada_County_Boundaries/FeatureServer/0
    provider: Nevada DOT (NDOT)
    type: ArcGIS REST FeatureServer — covers NV plus bordering-state
      counties; filter where=STATE_ABV='NV'
    field_mapping:
      COUNTYNAME: name
      COUNTY_FIPS: attributes.county_fips
      COUNTY_ABV: attributes.county_abbreviation
    note: filtered query verified 17 (16 counties + Carson City, which
      appears as its own COUNTYNAME record).

  municipalities:
    status: gap — no live NV state source giving incorporated-city
      polygons specifically
    note: a candidate layer (gis.dot.nv.gov/.../GeoHub/Cities/FeatureServer/0,
      count=1,196) is a point layer of "currently or previously populated
      places" from 1980s/2003 USGS GNIS data — includes unincorporated
      towns and historic places, no incorporation-status field to filter
      on. Recommend Census TIGER Places filtered by LSAD=25 as a fallback,
      or per-city GIS portals (Clark, Washoe, Carson City) as a last resort.

  school_districts:
    status: no live NV DOE GIS/API (nevadareportcard.nv.gov is a
      client-rendered SPA whose API endpoint returns an HTML shell, not JSON)
    fallback: Census TIGERweb (tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/School/MapServer/0,
      filter STATE='32') — verified 17, matching NV's 17 county-wide
      districts exactly.

  educational_region:
    status: confirmed none — consistent with NV's county-wide district
      model (each of the 17 districts is coextensive with a county).

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
