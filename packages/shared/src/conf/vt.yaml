# Vermont locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in VT's own
# vocabulary and structure; notes below cover only what's VT-specific.
#
# `judicial_region` and `scholastic_athletic_region` are intentionally
# absent: VT's Superior Court is organized by subject-matter division
# within each county rather than a separate multi-county judicial region
# (same shape as MA's Trial Court), and VPA's division/class structure
# wasn't confirmed with confidence this session.

profile:
  code: US-VT
  name: Vermont
  config:
    villages_exist: true # ~30 remain active, providing water/sewer/police/fire/streetlighting inside town boundaries — the only New England state with true incorporated villages

concepts:
  state:
    local_name: Vermont
    has_active_government: true
    default_body_name: General Assembly
    executive_title: Governor
    subdivisions: Towns
    additional_subdivisions:
      major_cities: [Burlington, South Burlington, Rutland]

  # unlike every other state in this set, VT counties have no elected
  # legislative body or executive at all. Each county instead elects 2
  # "Assistant Judges" ("Side Judges") who do double duty: sitting beside
  # the presiding Superior Court judge on factual/some legal matters, and
  # serving as the county's administrators (appointing the clerk,
  # treasurer, auditor, and road commissioners; managing courthouse/sheriff
  # property; preparing the county budget) — individually elected officials
  # with judicial+administrative duties, not a governing board
  county:
    local_name: County
    has_active_government: false
    subdivisions: false

  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    # Burlington's mayor holds genuine, historically forceful executive
    # authority (e.g. Bernie Sanders, 1981-89) even while sharing
    # legislative/budget power with the Council
    governance: strong-mayor
    subdivisions: false

  town:
    local_name: Town
    has_active_government: true
    default_body_name: Select Board
    governance: town-meeting
    subdivisions: false

  village:
    local_name: Village
    has_active_government: true
    default_body_name: Village Trustees
    executive_required: false
    legislative_committees: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: School Board

  # shares a superintendent's office across constituent town school
  # districts, each independently governed by its own elected board —
  # governance mechanics of the SU/SD board itself are less certain than
  # the rest of this file
  educational_region:
    local_name: Supervisory Union
    has_active_government: true
    default_body_name: Supervisory Union Board

  # House districts are labeled by county (e.g. "Chittenden-1") rather than
  # simple sequential numbers
  state_house_district:
    local_name: House District
    has_active_government: false

  # VT is the only state with any 3-member Senate districts, using bloc
  # voting rather than single-member seats
  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  town-meeting:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://maps.vcgi.vermont.gov/arcgis/rest/services/VCGI_services/VCGI_BASEMAP_SP_v2/MapServer/22
    provider: VCGI (Vermont Center for Geographic Information)
    type: ArcGIS REST MapServer
    field_mapping:
      CNTYNAME: name
      CNTYGEOID: jurisdiction_identifiers (scheme "census_geoid")
    note: verified 14 counties. No county-government fields exist in this
      layer, consistent with VT counties having no governing body of their
      own (see the county concept's note above).

  municipalities:
    url: https://services1.arcgis.com/BkFxaEFNwHqX3tAw/arcgis/rest/services/FS_VCGI_OPENDATA_Boundary_BNDHASH_poly_towns_SP_v1/FeatureServer/0
    provider: same VCGI org, "Towns" layer (a separate "Villages" layer also
      exists at .../poly_villages_SP_v1/FeatureServer/0)
    type: ArcGIS REST FeatureServer
    field_mapping:
      TOWNNAME: name
      CNTY: parent county
      TOWNGEOID / FIPS6: jurisdiction_identifiers (scheme "census_geoid")
    note: verified 256 towns/cities (no field distinguishes City vs. Town
      legal status — cross-reference GEOID/FIPS against Census designations
      to split them). Villages layer verified at 34 records (vs. ~30 cited
      as "active" — likely includes some dissolved/inactive villages; no
      IsActive-type filter field was confirmed, worth checking before ingest).

  school_districts:
    url: https://services1.arcgis.com/BkFxaEFNwHqX3tAw/arcgis/rest/services/FS_VCGI_OPENDATA_Boundary_SCHOOLBNDS_poly_sunions_SP_v1/FeatureServer/0
    provider: same VCGI org, "School Supervisory Unions" (updated FY2027)
    type: ArcGIS REST FeatureServer
    field_mapping:
      SU_Name: name
      SUSD / SUID / SUNION: jurisdiction_identifiers (scheme "vt_su") — code
        prefixes distinguish legacy Supervisory Union vs. merged Unified
        School District, though no explicit Type field does this cleanly
    note: verified 52 records — this is VT's current post-Act 46
      consolidated structure (mixing legacy Supervisory Unions and merged
      Unified School Districts), not the older ~119-member-district count.
      This single layer effectively answers both school_districts and
      educational_region for VT.

  educational_region:
    url: https://services1.arcgis.com/BkFxaEFNwHqX3tAw/arcgis/rest/services/FS_VCGI_OPENDATA_Boundary_SCHOOLBNDS_poly_sunions_SP_v1/FeatureServer/0
    note: same source as school_districts above — VT AOE
      (education.vermont.gov) itself exposes no REST/API endpoint; VCGI's
      GIS layer is the only verified live machine-readable source for VT
      school governance.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population.
