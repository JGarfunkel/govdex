# West Virginia locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in WV's own
# vocabulary and structure; notes below cover only what's WV-specific.
#
# `village` is intentionally absent: WV law folds "town" and "village" into
# one combined statutory class ("Class IV city: town or village," under
# 2,000 population), so `town` alone carries that class rather than
# splitting it the way NY's separate town/village concepts do.

profile:
  code: US-WV
  name: West Virginia
  config:
    judicial_regions: 29 # judicial circuits (reduced from 30 effective Jan 2025)
    athletic_sections: 4 # WVSSAC classes (A-AAAA)
    school_districts: 8 # Educational Service Cooperatives (formerly Regional Education Service Agencies/RESAs until 2018)

concepts:
  state:
    local_name: West Virginia
    has_active_government: true
    default_body_name: Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Charleston, Huntington, Morgantown, Parkersburg]

  # a 3-member County Commission (5 in Jefferson County) holds combined
  # executive + legislative authority; its President is chosen by the
  # commissioners themselves, not a separately elected office
  county:
    local_name: County
    has_active_government: true
    default_body_name: County Commission
    subdivisions: Cities, Towns
    legislative_committees: true
    committees_label: Committees

  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    # Charleston pairs an elected Mayor with an appointed City Manager —
    # still a separately elected chief executive, so counted as strong-mayor
    governance: strong-mayor
    subdivisions: false

  town:
    local_name: Town or Village
    has_active_government: true
    default_body_name: Council
    executive_title: Mayor
    executive_required: false
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: County Board of Education

  educational_region:
    local_name: Educational Service Cooperative
    local_abbrev: ESC
    has_active_government: true
    default_body_name: ESC Board

  scholastic_athletic_region:
    local_name: Class
    parent_org_name: WVSSAC
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial Circuit
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://gis.transportation.wv.gov/arcgis/rest/services/Boundaries/MapServer/1
    provider: WV Dept of Transportation (WVDOT), layer "WV_Counties"
    type: ArcGIS REST MapServer
    field_mapping:
      NAME: name
      FIPS: attributes.county_fips
      CO_CODE: attributes.wv_county_code
    note: verified 55 counties, exact match.

  municipalities:
    url: https://gis.transportation.wv.gov/arcgis/rest/services/Boundaries/MapServer/15
    provider: same WVDOT host, layer "Incorporated Places" (an annexation
      overlay also exists at layer 16, "Incorporated_Places_Annex")
    type: ArcGIS REST MapServer
    note: verified 231 records, matching the ~230 City/Town-or-Village total closely.

  school_districts:
    status: no separate live dataset exists
    note: WV's 55 school districts are legally co-terminous with its 55
      counties (WV Code, county-unit system), each run by a County Board of
      Education — the counties source above (NAME field) doubles as the
      district list. No distinct WVDE-published GIS/API layer was found.

  educational_region:
    status: confirmed to exist but no live API or directory found
    note: 8 Educational Service Cooperatives (since 2018, replacing RESAs
      per WV Code §18-5-13c) — checked wvde.us/middle-secondary-learning/gis/
      and the WVDE sitemap, no machine-readable roster. Only substantive
      source is prose history at wvencyclopedia.org/entries/40 (e-WV
      Encyclopedia), confirming the 2018 RESA→ESC transition but listing no
      roster of the 8 ESCs or their county membership — would need manual
      compilation from WV Code §18-5-13c or individual county-board sites.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
