# South Carolina locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in SC's own
# vocabulary and structure; notes below cover only what's SC-specific.
#
# `educational_region` is intentionally absent: no statewide-branded
# regional education service agency (comparable to GA's RESA) was confirmed
# for SC.

profile:
  code: US-SC
  name: South Carolina
  config:
    judicial_regions: 16 # judicial circuits

concepts:
  state:
    local_name: South Carolina
    has_active_government: true
    default_body_name: General Assembly
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Columbia, Charleston, North Charleston, Mount Pleasant, Rock Hill, Greenville]

  county:
    local_name: County
    has_active_government: true
    default_body_name: County Council
    executive_required: false
    # of the 4 forms the 1975 Home Rule Act permits (council, council-
    # supervisor, council-administrator, council-manager), most counties
    # run an appointed Administrator/Manager rather than an elected executive
    subdivisions: Municipalities
    legislative_committees: true
    committees_label: Committees

  # SC law treats "municipality," "city," and "town" as legally
  # interchangeable — a single incorporation certificate covers all three
  city:
    local_name: Municipality
    has_active_government: true
    default_body_name: City/Town Council
    executive_title: Mayor
    # Columbia is confirmed council-manager; only mayor-council grants the
    # mayor real administrative/hiring authority among SC's 3 recognized forms
    governance: [council-manager, strong-mayor]
    subdivisions: false

  # 103 districts across 46 counties — several counties run more than one
  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: School Board

  scholastic_athletic_region:
    local_name: Region
    parent_org_name: SCHSL
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial Circuit
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://gis.scdot.org/hosting/rest/services/Hosted/SC_Counties/FeatureServer/0
    provider: South Carolina Dept of Transportation (SCDOT)
    type: ArcGIS REST FeatureServer
    field_mapping:
      ctyname (or countynm): name
      stcntyfips (or stcntycode): attributes.county_fips
    note: verified 46 counties, exact match. A similarly-named layer at
      arcweb.dnr.sc.gov (.../SC_County/MapServer) is actually a multi-state
      2007 TIGER layer (count=76) — do not use it, it's not SC-specific.

  municipalities:
    url: https://services2.arcgis.com/8uN5i97bMkq2Mzrt/arcgis/rest/services/municipal_boundaries/FeatureServer/0
    provider: SC Revenue & Fiscal Affairs Office (RFA), sourced from SCDOT, dated April 2024
    type: ArcGIS REST FeatureServer
    field_mapping:
      CITY_NAME: name
      COUNTY_ID / COUNTY_NAM: parent county
    note: endpoint is live, but an unfiltered count query returned only 7 —
      likely needs a proper where clause or pagination
      (resultOffset/resultRecordCount) rather than the full ~271 statewide
      total. Flagged as live-but-unverified-at-scale; re-query before
      relying on it. RFA's mapping hub (rfa.sc.gov/mapping) is the
      authoritative source but no other statewide REST layer was found.

  school_districts:
    url: https://services1.arcgis.com/Ua5sjt3LWTPigjyD/arcgis/rest/services/School_Districts_Current/FeatureServer/0
    provider: a nationwide Census TIGER-sourced layer (also used for AZ) — filter STATEFP='45' for South Carolina
    type: ArcGIS REST FeatureServer
    field_mapping:
      NAME: name
      GEOID: jurisdiction_identifiers (scheme "census_geoid")
      SDTYP: concept_id
    note: filtered query returned 72, plausible given SC's known district
      consolidations (was 81), but not cross-verified against SC DOE's own
      authoritative figure — SC DOE's own site (ed.sc.gov) exposed no
      discoverable REST/API endpoint.

  educational_region:
    status: confirmed none — SC is explicitly listed among states with no
      Educational Service Agency structure (alongside DE, ID, LA, ME, NV,
      TN); SCDE oversees ~79 LEAs directly, no intermediate cooperative
      layer.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
