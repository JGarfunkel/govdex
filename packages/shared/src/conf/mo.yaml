# Missouri locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in MO's own
# vocabulary and structure; notes below cover only what's MO-specific.
#
# St. Louis has been an independent city — not part of any county — since
# the 1876 "Great Divorce," pulled out via `additional_subdivisions` below,
# the same technique ny.yaml uses for NYC. `educational_region` and
# `scholastic_athletic_region` are intentionally absent: no confirmed
# BOCES-equivalent agency or stable MSHSAA class/region count was found.

profile:
  code: US-MO
  name: Missouri
  config:
    judicial_regions: 46 # judicial circuits

concepts:
  state:
    local_name: Missouri
    has_active_government: true
    default_body_name: General Assembly
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Kansas City, Springfield, Columbia, Independence, St. Joseph]
      independent_cities: [St. Louis]

  county:
    local_name: County
    has_active_government: true
    default_body_name: County Commission
    executive_title: County Executive
    executive_required: false
    # only charter counties (e.g. St. Louis County, Jackson County) have an
    # elected County Executive; the rest use a 3-member Commission
    subdivisions: Cities, Towns, Villages
    legislative_committees: true
    committees_label: Committees

  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    governance: [strong-mayor, council-manager]
    # Kansas City has used a weak-mayor, council-manager charter since the
    # 1920s; also modeled here rather than as its own jurisdiction, unlike
    # St. Louis's independent-city status above
    governance_exceptions:
      council-manager: [Kansas City]
    subdivisions: false

  town:
    local_name: Town
    has_active_government: true
    default_body_name: Town Council
    executive_required: false
    legislative_committees: false

  village:
    local_name: Village
    has_active_government: true
    default_body_name: Village Board
    executive_required: false
    legislative_committees: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Education

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial Circuit
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://gis.mo.gov/arcgis/rest/services/BaseMap/county_boundary/MapServer/0
    provider: Missouri Office of Geospatial Information (OGI)
    type: ArcGIS REST MapServer
    note: verified 115 records (114 counties + St. Louis, which Census/MO
      treat as a county-equivalent — consistent with its independent-city
      status). Field schema wasn't confirmed this session.

  municipalities:
    url: https://gis.mo.gov/arcgis/rest/services/BaseMap/county_city_boundary/MapServer/1
    provider: same OGI host, layer "City Limit" — this is Census TIGER Places
      data re-hosted by Missouri, not a state-authored municipal registry
    type: ArcGIS REST MapServer
    field_mapping:
      NAME: name
      PLACE: attributes.place_fips
      POP10: attributes.population_estimate (dated — see population below)
    note: verified live and St. Louis is present/identifiable by name
      (PLACE=65000), but this layer has NO field distinguishing legal type
      (city/town/village) and NO parent-county field — MSDIS's open-data
      catalog was also checked and has no dedicated dataset with legal
      classification. Flagged as a real gap, not solved by a guessed source.

  school_districts:
    url: https://gis.mo.gov/arcgis/rest/services/DESE/Missouri_Public_Schools/MapServer/1
    provider: Missouri DESE (Dept of Elementary and Secondary Education) + OGI, layer "Public School Districts"
    type: ArcGIS REST MapServer
    note: verified 515 records (close to the ~518 expected). The alternate
      host ogi.oa.mo.gov seen in search results does not resolve — use
      gis.mo.gov only.

  educational_region:
    status: no live equivalent exists
    note: DESE's 9 Regional Professional Development Centers (RPDCs) are
      real and regionally organized, but are hosted at universities (e.g.
      rpdc.missouri.edu) with no unified API/GIS layer — only static PDF
      directories — and their statutory role is professional development/
      school improvement, not the shared-services/special-ed/purchasing
      role BOCES/CESA/Service Cooperatives play elsewhere. Not a genuine
      BOCES-equivalent.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
