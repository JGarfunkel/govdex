# Maryland locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in MD's own
# vocabulary and structure; notes below cover only what's MD-specific.
#
# Baltimore City is MD's one Virginia-style independent city — not part of
# any county — pulled out via `additional_subdivisions` below rather than a
# separate concept, the same technique ny.yaml uses for NYC.

profile:
  code: US-MD
  name: Maryland
  config:
    judicial_regions: 8 # circuit court judicial circuits, covering 23 counties + Baltimore City
    school_districts: 24 # one local school system per county, plus Baltimore City

concepts:
  state:
    local_name: Maryland
    has_active_government: true
    default_body_name: General Assembly
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Frederick, Rockville, Gaithersburg, Bowie, Hagerstown]
      independent_cities: [Baltimore City]

  county:
    local_name: County
    has_active_government: true
    default_body_name: County Council
    executive_title: County Executive
    executive_required: false
    # only charter counties (7-8 of 23: Anne Arundel, Baltimore, Harford,
    # Howard, Montgomery, Prince George's, Wicomico, and likely Frederick)
    # have an elected County Executive alongside the Council; the rest are
    # non-charter and use a Board of County Commissioners instead
    subdivisions: Municipalities
    legislative_committees: true
    committees_label: Committees

  # MD draws no strict functional line between "town" and "city" charters
  city:
    local_name: Municipality
    has_active_government: true
    default_body_name: Town/City Council
    executive_title: Mayor
    # Baltimore City is confirmed strong-mayor (controls 3 of 5 Board of
    # Estimates votes); it is also modeled as a state-level jurisdiction
    # above, not a county subdivision
    governance: [strong-mayor, council-manager]
    governance_exceptions:
      strong-mayor: [Baltimore City]
    subdivisions: false

  school_district:
    local_name: School System
    has_active_government: true
    default_body_name: Board of Education

  scholastic_athletic_region:
    local_name: Classification
    parent_org_name: MPSSAA
    has_active_government: false

  # MD's Senate and House of Delegates share the same 47 numbered
  # legislative districts — each elects 1 Senator + 3 Delegates, same
  # shared-numbering pattern as NJ's Assembly/Senate districts
  state_house_district:
    local_name: House of Delegates District
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial Circuit
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://mdgeodata.md.gov/imap/rest/services/Boundaries/MD_PoliticalBoundaries/FeatureServer/1
    provider: Maryland iMap (Dept of Planning)
    type: ArcGIS REST FeatureServer
    field_mapping:
      COUNTY: name
      COUNTY_FIP: attributes.county_fips
      COUNTYNUM: attributes.md_county_number
    note: verified 24 records (23 counties + independent Baltimore City).

  municipalities:
    url: https://mdgeodata.md.gov/imap/rest/services/Boundaries/MD_PoliticalBoundaries/FeatureServer/2
    provider: same MD iMap host, "Municipal Boundaries" (a detailed variant
      also exists at FeatureServer/5)
    type: ArcGIS REST FeatureServer
    note: verified 162 records (vs. ~157 chartered municipalities —
      plausibly some multi-part/annexation-parcel records). Baltimore City
      is correctly captured only in the counties layer above, not
      double-counted here.

  school_districts:
    status: no standalone live state API found
    note: MSDE's own site exposes no geo/API layer distinct from county
      boundaries — MD's 24 LEAs are conterminous with the 24 county-layer
      polygons above (dependent-district governance, not independent school
      district governments). Census Bureau Unified School District
      cartographic boundary files (2024 vintage) exist on catalog.data.gov
      but weren't independently re-verified as a live REST endpoint.

  educational_region:
    status: confirmed none
    note: consistent with MD's dependent-district model — each LEA is
      dependent on its county or independent-city government, with no
      independent school district governments and no regional intermediate layer.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
