# Michigan locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in MI's own
# vocabulary and structure; notes below cover only what's MI-specific.

profile:
  code: US-MI
  name: Michigan
  config:
    judicial_regions: 57 # circuit courts, covering the state's 83 counties (some multi-county)
    athletic_sections: 4 # MHSAA classes (A/B/C/D); separate 1-4 divisions layer on top for tournament seeding
    school_districts: 57 # Intermediate School Districts (ISDs)

concepts:
  state:
    local_name: Michigan
    has_active_government: true
    default_body_name: Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Detroit, Grand Rapids, Warren, Sterling Heights, Ann Arbor, Lansing, Flint]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of Commissioners
    executive_title: County Executive
    executive_required: false
    # only 4 of 83 counties (Wayne, Macomb, Oakland, Bay) have adopted a
    # charter or optional-unified form with an elected County Executive
    subdivisions: Cities, Villages, Townships
    legislative_committees: true
    committees_label: Committees

  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    governance: [council-manager, strong-mayor]
    # Detroit is the marquee strong-mayor example; Ann Arbor and Kalamazoo
    # are confirmed council-manager
    governance_exceptions:
      strong-mayor: [Detroit]
    subdivisions: false

  # active general-purpose civil governments (1,240 statewide) — the
  # elected Township Supervisor chairs the board and serves as its chief
  # administrative officer
  town:
    local_name: Township
    has_active_government: true
    default_body_name: Township Board
    executive_title: Township Supervisor
    subdivisions: false

  # a distinct legal category from `city`, led by an elected Village
  # President rather than a Mayor
  village:
    local_name: Village
    has_active_government: true
    default_body_name: Village Council
    executive_title: Village President
    governance: council-manager
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Education

  educational_region:
    local_name: Intermediate School District
    local_abbrev: ISD
    has_active_government: true
    default_body_name: ISD Board

  scholastic_athletic_region:
    local_name: Class
    parent_org_name: MHSAA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Circuit
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://imagery.michigan.gov/server/rest/services/CountiesAndMuniBoundaries/MapServer/1
    provider: Michigan Center for Geographic Information / DTMB
    type: ArcGIS REST MapServer
    note: verified 83 counties via returnCountOnly, exact match.

  municipalities:
    url: https://imagery.michigan.gov/server/rest/services/CountiesAndMuniBoundaries/MapServer/0
    provider: same DTMB service, layer 0 "MinorCivilDivisions"
    type: ArcGIS REST MapServer
    field_mapping:
      NAME: name
      FIPSCODE / FIPSNUM: attributes.fips_code
      TYPE: concept_id (city/township/village)
    note: verified 1,518 rows (MI has ~280 cities + ~1,240 townships and
      villages ≈ 1,520 — close match). The older
      gis-michigan.opendata.arcgis.com "Counties/MCD v17a" datasets are
      deprecated in favor of this service.

  school_districts:
    url: https://cepi.state.mi.us/eem/publicdatasets.aspx
    provider: CEPI (Center for Educational Performance and Information) —
      Educational Entity Master (EEM) tool
    type: dynamic export tool (form POST/session-based, not a bare REST
      GET/query endpoint) — verified live, covers LEA Districts, ISD
      Districts, PSA Districts, and the State District, downloadable as
      CSV/Excel/XML
    note: a gisp.mcgi.state.mi.us/maps/rest/services/MDE/CEPIDashboardMap/MapServer/1
      School Districts ArcGIS layer was also found via search but the host
      was unreachable (522 error) when checked — the CEPI EEM tool above is
      the confirmed-live alternative, but a real ingestion script will need
      to handle it as a semi-dynamic export rather than a simple REST query.

  # Michigan's BOCES-equivalent — same CEPI EEM tool as school_districts above
  educational_region:
    url: https://cepi.state.mi.us/eem/publicdatasets.aspx
    note: same tool exports Intermediate School Districts (57 ISDs) alongside
      the district rosters above.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
