# Texas locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in TX's own
# vocabulary and structure; notes below cover only what's TX-specific.

profile:
  code: US-TX
  name: Texas
  config:
    villages_exist: false # a municipality may be styled "Town of ___" or "Village of ___" but it's cosmetic — all incorporated places are legally Type A/B/C general-law or home-rule cities
    judicial_regions: 14 # geographically-organized Courts of Appeals districts (a 15th court exists but has statewide, non-geographic jurisdiction)
    athletic_sections: 4 # UIL regions (each split into 8 districts, 32 total)
    school_districts: 20 # Education Service Centers (ESCs)

concepts:
  state:
    local_name: Texas
    has_active_government: true
    default_body_name: State Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Houston, San Antonio, Dallas, Austin, Fort Worth, El Paso, Arlington, Corpus Christi, Plano, Lubbock, Laredo, Irving]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Commissioners Court
    executive_title: County Judge
    executive_required: true
    # every county has this same officer, but it's a weak/ceremonial chief
    # executive: the Judge presides over and votes as one of five members of
    # the Commissioners Court, with no independent veto
    subdivisions: Cities
    legislative_committees: true
    committees_label: Committees

  # `town` and `village` are intentionally absent — TX eliminated those as
  # distinct legal categories in 1987; every incorporated place is legally a
  # "city" (Type A/B/C general-law or home-rule) regardless of its charter name
  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    governance: [council-manager, strong-mayor]
    governance_exceptions:
      strong-mayor: [Houston]
    subdivisions: false

  school_district:
    local_name: Independent School District
    local_abbrev: ISD
    has_active_government: true
    default_body_name: Board of Trustees

  educational_region:
    local_name: Education Service Center
    local_abbrev: ESC
    has_active_government: true
    default_body_name: ESC Board

  scholastic_athletic_region:
    local_name: Region
    parent_org_name: UIL
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Court of Appeals District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  # dominant among larger/home-rule cities (Dallas, Austin, San Antonio)
  council-manager:
    legislative_committees: false
    legislative_districts: false

  # a separately elected mayor with real executive power (budget, veto,
  # appointment authority) distinct from the council — Houston is the major
  # exception among big cities
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://maps.dot.state.tx.us/arcgis/rest/services/Boundaries/MapServer/1
    provider: TxDOT, public "Boundaries" MapServer (layer 1, "Texas Counties")
    type: ArcGIS REST MapServer — query with /query?where=1=1&outFields=*&f=json
    field_mapping:
      CNTY_NM: name
      FIPS_NBR: attributes.county_fips
      CMPTRL_NBR: attributes.comptroller_county_number
    note: verified 254 counties via returnCountOnly. No website field.

  municipalities:
    url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/28
    provider: US Census Bureau TIGERweb (Incorporated Places layer), filtered to STATE='48'
    type: ArcGIS REST MapServer
    field_mapping:
      GEOID: jurisdiction_identifiers (scheme "census_geoid")
      PLACE: attributes.place_fips
      NAME (or BASENAME): name
      LSADC: concept_id — the legal/statistical descriptor distinguishes city/town/village
    note: verified 1,230 incorporated places (close to the Texas Municipal
      League's reported 1,224 figure). No Texas-specific live API was found —
      data.texas.gov has no comprehensive municipalities dataset, and TML only
      offers custom CSV/Excel exports on request (database@tml.org), not a
      public API. TIGERweb is the only live, queryable source found.

  school_districts:
    url: https://services2.arcgis.com/5MVN2jsqIrNZD4tP/arcgis/rest/services/Map/FeatureServer/0
    provider: Texas Legislative Council, built from TEA data (dataset "School
      Districts 2025" — discovered via TEA's public DCAT catalog feed at
      https://schoolsdata2-tea-texas.opendata.arcgis.com/api/feed/dcat-us/1.1.json;
      TEA republishes this annually under a year-suffixed name, so a real
      ingestion script should resolve the current year's URL from that DCAT
      feed rather than hardcoding one)
    type: ArcGIS REST FeatureServer
    field_mapping:
      DISTRICT_C: jurisdiction_identifiers (scheme "tea_cdn") — 6-digit
        County-District Number, TEA's BEDS-equivalent
      NAME (or NAME20): name
    note: verified 1,017 districts. No explicit county or website field —
      county is derivable from the CDN's first 3 digits (TEA county code).

  educational_region:
    url: https://services2.arcgis.com/5MVN2jsqIrNZD4tP/arcgis/rest/services/ESC2024/FeatureServer/0
    provider: same TEA open-data org, dataset "ESC2024" (year-suffixed like the districts dataset above)
    type: ArcGIS REST FeatureServer
    field_mapping:
      ESC_REGION: local_abbrev / identifier (1-20 region number)
      CITY: host city
      WEBSITE: website
    note: verified exactly 20 regions.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS already captured by the counties source above.
