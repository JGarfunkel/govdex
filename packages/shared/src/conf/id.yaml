# Idaho locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in ID's own
# vocabulary and structure; notes below cover only what's ID-specific.
#
# `town`/`village` are intentionally absent: Idaho has no legal municipal
# category distinct from `city`. `educational_region` is also absent: no
# BOCES-equivalent regional agency was identified.

profile:
  code: US-ID
  name: Idaho
  config:
    judicial_regions: 7 # judicial districts
    athletic_sections: 6 # IHSAA classifications (6A-1A), organized into 6 geographic districts

concepts:
  state:
    local_name: Idaho
    has_active_government: true
    default_body_name: Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Boise, Meridian, Nampa, Idaho Falls, Pocatello]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of County Commissioners
    subdivisions: Cities
    legislative_committees: true
    committees_label: Committees

  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    # Boise is confirmed strong-mayor, an exception to the Mountain West's
    # usual council-manager pattern
    governance: strong-mayor
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Trustees

  scholastic_athletic_region:
    local_name: District
    parent_org_name: IHSAA
    has_active_government: false

  # ID's 35 Legislative Districts are combined: each elects 1 Senator + 2
  # Representatives under the same district number, same structure as AZ
  state_house_district:
    local_name: Legislative District
    local_abbrev: LD
    has_active_government: false

  state_senate_district:
    local_name: Legislative District
    local_abbrev: LD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://services1.arcgis.com/CNPdEkvnGl65jCX8/arcgis/rest/services/Idaho_County_Boundaries_view/FeatureServer/0
    provider: Idaho Geospatial Office
    type: ArcGIS REST FeatureServer
    field_mapping:
      County_Name: name
      FIPS: attributes.county_fips
      LicensePlate: attributes.license_plate_code
    note: verified 44 counties, exact match. A candidate host
      gis2.idaho.gov was unreachable (ECONNREFUSED) every time — don't
      treat it as confirmed.

  municipalities:
    url: https://services1.arcgis.com/CNPdEkvnGl65jCX8/arcgis/rest/services/City_Town/FeatureServer/0
    provider: same Idaho Geospatial Office host
    type: ArcGIS REST FeatureServer
    note: verified 237 records — a superset including Census-designated
      places; has census TYPE/PLACE fields to filter down to incorporated
      "City" only (Idaho's sole municipal category).

  school_districts:
    status: no live ID SDE GIS/API found (only a static "Idaho Schools" directory page)
    fallback: https://nces.ed.gov/opengis/rest/services/School_District_Boundaries/EDGE_SCHOOLDISTRICT_TL24_SY2324/MapServer/0
      (federal NCES EDGE layer, filter STATEFP=16) — verified 115 districts, exact match.

  educational_region:
    status: confirmed none — no BOCES/ESU/ESC-equivalent statewide tier
      exists; shared-services arrangements between ID districts appear to
      be informal interlocal cooperatives, not a formal statewide structure.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
