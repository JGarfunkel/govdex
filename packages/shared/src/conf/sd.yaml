# South Dakota locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in SD's own
# vocabulary and structure; notes below cover only what's SD-specific.
#
# `educational_region` is intentionally absent: no BOCES-equivalent regional
# agency was confirmed for South Dakota. Township activity in SD wasn't
# confirmed either (unlike neighboring ND/NE), so `town`/township is
# omitted rather than guessed.

profile:
  code: US-SD
  name: South Dakota
  config:
    judicial_regions: 7 # judicial circuits (SD calls them "circuits," not "districts")

concepts:
  state:
    local_name: South Dakota
    has_active_government: true
    default_body_name: Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Sioux Falls, Rapid City, Aberdeen]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of County Commissioners
    subdivisions: Cities, Towns
    legislative_committees: true
    committees_label: Committees

  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council/Commission
    executive_title: Mayor
    governance: strong-mayor
    subdivisions: false

  # first/second-class municipalities are "cities"; smaller places using a
  # town-meeting form are "towns" — a real but lower-confidence distinction
  # (general knowledge, not independently re-verified)
  town:
    local_name: Town
    has_active_government: true
    default_body_name: Town Board
    executive_required: false
    legislative_committees: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Education

  scholastic_athletic_region:
    local_name: Region
    parent_org_name: SDHSAA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial Circuit
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://sdgis.sd.gov/arcgis1/rest/services/Counties/MapServer/0
    provider: State of South Dakota GIS
    type: ArcGIS REST MapServer
    note: verified 66 counties, exact match. The host arcgis.sd.gov (seen in
      search results) refused connections repeatedly — sdgis.sd.gov is the
      reliable mirror.

  municipalities:
    url: https://sdgis.sd.gov/arcgis1/rest/services/SD_All/Boundary_City/MapServer/0
    provider: same SD GIS host, updated quarterly by the SD Dept of Revenue
    type: ArcGIS REST MapServer
    field_mapping:
      CITY: name
      CityFIPS: jurisdiction_identifiers (scheme "census_geoid")
      CNTY_FIPS: parent county
      TYPE: concept_id — filter to city/town; raw values also include CDP/
        "New town"/retired records
    note: raw count 341 includes CDPs and retired records; filtering TYPE to
      city/town is needed to reach the ~310 municipality figure.

  school_districts:
    url: https://sdgis.sd.gov/host/rest/services/Hosted/Boundary_SchoolDistricts/FeatureServer/0
    provider: SD BIT GIS for the SD Dept of Education, "School District
      Boundaries 2023-2024"
    type: ArcGIS REST FeatureServer
    field_mapping:
      name (or short_name): name
      dist_num / sdlea: jurisdiction_identifiers (scheme "sd_sdlea")
      sdtyp: concept_id
    note: schema confirmed live and current; a record count wasn't pulled
      this session — recommend a follow-up returnCountOnly query before ingesting.

  educational_region:
    status: confirmed none — no SD-wide intermediate education service
      agency layer was found in DOE or BIT GIS sources.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
