# New Hampshire locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in NH's own
# vocabulary and structure; notes below cover only what's NH-specific.
#
# `village` is intentionally absent: NH's "Village Districts" are
# special-purpose (water, fire, lighting) inside a town, not full
# incorporated municipalities. County government's budget-approval body,
# the "County Convention," is really that county's state-house delegation
# sitting in a second capacity rather than a body voters elect directly as
# a county legislature — not separately modeled here.

profile:
  code: US-NH
  name: New Hampshire
  config:
    judicial_regions: 10 # Circuit Court circuits, one per county
    athletic_sections: 4 # NHIAA enrollment divisions (I-IV)

concepts:
  state:
    local_name: New Hampshire
    has_active_government: true
    default_body_name: General Court
    executive_title: Governor
    subdivisions: Towns
    additional_subdivisions:
      major_cities: [Manchester, Nashua, Concord, Derry]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of County Commissioners
    subdivisions: Towns
    legislative_committees: true
    committees_label: Committees

  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    # Manchester's Board of Mayor and Aldermen is a hybrid: the mayor
    # supervises administrative affairs and presides over the Board, but
    # the Board retains real budget/policy power
    governance: strong-mayor
    subdivisions: false

  town:
    local_name: Town
    has_active_government: true
    default_body_name: Select Board
    # traditional open Town Meeting, or the increasingly common "SB 2"
    # official-ballot variant
    governance: town-meeting
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: School Board

  # an administrative unit overseeing one or more separate school
  # districts; in multi-district SAUs, a board drawn from each constituent
  # district's own board oversees shared SAU staff/budget
  educational_region:
    local_name: School Administrative Unit
    local_abbrev: SAU
    has_active_government: true
    default_body_name: SAU Board

  scholastic_athletic_region:
    local_name: Division
    parent_org_name: NHIAA
    has_active_government: false

  # the 400-member House uses some "floterial" districts spanning several
  # single/multi-member districts to balance representation across towns
  # without splitting them
  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Circuit
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  town-meeting:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    status: no live polygon layer with county names found (NH GRANIT's
      County layer is boundary lines only, no name field)
    fallback: Census TIGER national counties file
      (www2.census.gov/geo/tiger/TIGER2024/COUNTY/tl_2024_us_county.zip),
      filterable to NH's 10 counties by STATEFP=33.

  municipalities:
    url: https://nhgeodata.unh.edu/hosting/rest/services/Hosted/GV_BaseLayers/FeatureServer/8
    provider: NH GRANIT (UNH)
    type: ArcGIS REST FeatureServer
    field_mapping:
      name: name
      fips: jurisdiction_identifiers (scheme "census_geoid")
      county: parent county (numeric code)
      pop20: attributes.population_estimate (see population below)
    note: verified 259 records — this includes unincorporated grants/
      locations/purchases in Coös County, not just the 234 legal cities/
      towns, so a filter is needed. Cross-checked against NHDOT's own
      Boundaries FeatureServer
      (maps.dot.nh.gov/arcgis_server/rest/services/Boundaries/NHDOT_BOUNDARIES_Towns/FeatureServer/2),
      also confirmed live with the same count.

  school_districts:
    status: blocked, not confirmed absent
    note: every NH DOE endpoint checked (education.nh.gov, the SAU map PDF,
      my.doe.nh.gov) returned HTTP 403 on every attempt (bot-protection,
      Akamai/Cloudflare-style) — this is a fetch block, not evidence the
      data doesn't exist. Would need an authenticated/whitelisted fetch or
      manual download to confirm a source.

  educational_region:
    status: same blocked status as school_districts
    note: NH's SAU layer is itself this overlay, but no live source could
      be verified given the 403 block above.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population. The municipalities
      source's own pop20 field works as a quicker fallback.
