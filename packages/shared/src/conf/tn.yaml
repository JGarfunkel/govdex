# Tennessee locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in TN's own
# vocabulary and structure; notes below cover only what's TN-specific.
#
# `educational_region` and `scholastic_athletic_region` are intentionally
# absent: no BOCES-equivalent regional agency was found, and TSSAA's
# region/classification structure wasn't confirmed with confidence.

profile:
  code: US-TN
  name: Tennessee
  config:
    judicial_regions: 32 # judicial districts (each pairing a Circuit Court and a Chancery Court)

concepts:
  state:
    local_name: Tennessee
    has_active_government: true
    default_body_name: General Assembly
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Nashville, Memphis, Knoxville, Chattanooga, Clarksville, Murfreesboro]

  # renamed from "County Executive" to "County Mayor" in 2003. Nashville/
  # Davidson is the one exception: a fully consolidated city-county
  # government (Metro Nashville) since 1963, with no separate county mayor
  county:
    local_name: County
    has_active_government: true
    default_body_name: County Commission
    executive_title: County Mayor
    executive_required: true
    subdivisions: Municipalities
    legislative_committees: true
    committees_label: Committees

  # TN draws no legal distinction between "city" and "town" — both have
  # identical legal status; no village category, no townships
  city:
    local_name: Municipality
    has_active_government: true
    default_body_name: Council
    executive_title: Mayor
    governance: [strong-mayor, council-manager]
    governance_exceptions:
      strong-mayor: [Memphis]
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Education

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties_municipalities:
    url: https://tnmap.tn.gov/arcgis/rest/services/ADMINISTRATIVE_BOUNDARIES/COUNTY_BOUNDARIES_AND_CITY_BOUNDARIES/MapServer
    provider: TN Comptroller of the Treasury (cities, per TCA §6-51-12), via
      TNMap/STS GIS Services
    type: ArcGIS REST MapServer — layer 1 "County Boundaries", layer 0 "City Boundaries"
    field_mapping:
      COUNTY (layer 1) / NAME (layer 0): name
    note: verified county count = 95 (exact match); city count = 345
      (matches ~347 closely).

  school_districts:
    status: no live ArcGIS/Socrata GIS API found
    note: best authoritative machine-readable source is the TN DOE School
      Directory (tnschooldirectory.tnedu.gov, an Excel export via a
      "Download Directory" button) and the TDOE Data Downloads page
      (tn.gov/education/districts/federal-programs-and-oversight/data/data-downloads.html,
      Excel/CSV district-level files).
    fallback: Census TIGER/Line 2024 Elementary/Secondary/Unified School
      District shapefiles for TN (catalog.data.gov) — standard federal
      fallback, not TN-specific.

  educational_region:
    status: confirmed none statewide
    note: the Tennessee Educational Cooperative (tn-edu.org) is a regional
      East-TN-only nonprofit (~8 member/non-member systems, founded 1971),
      not a statewide DOE-organized network. No other candidate covers all
      95 counties.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population.
