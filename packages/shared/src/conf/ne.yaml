# Nebraska locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in NE's own
# vocabulary and structure; notes below cover only what's NE-specific.
#
# Nebraska's Legislature is the only unicameral, officially nonpartisan
# state legislature in the US — there is no separate House/Senate, so
# `state_senate_district` is intentionally absent and `state_house_district`
# below is repurposed to carry the single chamber's "Legislative District."

profile:
  code: US-NE
  name: Nebraska
  config:
    judicial_regions: 12 # judicial districts, covering all 93 counties
    athletic_sections: 4 # NSAA classes (A/B/C/D, with C and D each further split into 1/2)
    school_districts: 17 # Educational Service Units (ESUs)

concepts:
  state:
    local_name: Nebraska
    has_active_government: true
    default_body_name: Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Omaha, Lincoln, Bellevue, Grand Island]

  # 66 of 93 counties are "commissioner counties" (Board of County
  # Commissioners, no townships); the other 27 are "township counties"
  # (Board of Supervisors, with active townships beneath — see `town`)
  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of County Commissioners
    subdivisions: Cities, Villages
    legislative_committees: true
    committees_label: Committees

  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    # Omaha (metropolitan class) and Lincoln (primary class) are both
    # confirmed strong mayor-council
    governance: strong-mayor
    subdivisions: false

  village:
    local_name: Village
    has_active_government: true
    default_body_name: Village Board of Trustees
    executive_required: false
    legislative_committees: false

  # active only within the 27 "township counties"; townless elsewhere
  town:
    local_name: Township
    has_active_government: true
    default_body_name: Board of Township Supervisors
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Education

  educational_region:
    local_name: Educational Service Unit
    local_abbrev: ESU
    has_active_government: true
    default_body_name: ESU Board

  scholastic_athletic_region:
    local_name: Class
    parent_org_name: NSAA
    has_active_government: false

  state_house_district:
    local_name: Legislative District
    local_abbrev: LD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://giscat.ne.gov/agency/rest/services/County_Boundaries/FeatureServer/0
    provider: Nebraska GIS catalog (giscat.ne.gov)
    type: ArcGIS REST FeatureServer
    note: verified 93 counties, exact match.

  municipalities:
    url: https://giscat.ne.gov/agency/rest/services/Municipal_Boundaries/FeatureServer/0
    provider: same NE GIS catalog, layer "BND_MunicipalBoundaries_OCIO",
      sourced from NE Dept of Revenue boundary-change filings
    type: ArcGIS REST FeatureServer
    note: verified 529 records (close to ~530) — includes Census Designated
      Places alongside legal cities/villages, so filtering by a TYPE-like
      field is advisable; the field list wasn't fully retrievable this session.

  school_districts:
    url: https://giscat.ne.gov/agency/rest/services/School_Districts/FeatureServer/0
    provider: same NE GIS catalog
    type: ArcGIS REST FeatureServer
    field_mapping:
      DistrictName: name
      DistrictNumber / SDLEA: jurisdiction_identifiers (scheme "ne_sdlea")
      ESU: parent Educational Service Unit — see educational_region below
    note: verified 245 records, exact match.

  educational_region:
    url: https://gis.ne.gov/Enterprise/rest/services/Educational_Service_Units/FeatureServer/0
    provider: Nebraska Dept of Education (NDE), published via NebraskaMap
    type: ArcGIS REST FeatureServer
    field_mapping:
      ESU: identifier (region number)
      Headquarters / City / St / Zip: attributes.headquarters_address
      Phone: attributes.phone
    note: verified 17 ESUs, exact match.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
