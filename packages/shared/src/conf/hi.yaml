# Hawaii locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in HI's own
# vocabulary and structure; notes below cover only what's HI-specific.
#
# Hawaii has no municipal government layer at all below the county — no
# `city`/`town`/`village` concepts exist here. Honolulu is a consolidated
# city-county government for the entire island of Oʻahu (like Denver or
# Nashville elsewhere), not a separate municipality inside a county.
# Hawaii is also the only state with a single, statewide school district —
# `school_district` below models that one statewide entity rather than a
# per-locality district, and `educational_region` is absent as a result.

profile:
  code: US-HI
  name: Hawaii
  config:
    judicial_regions: 4 # circuits (numbering skips "Fourth" — merged into the Third Circuit in 1943)
    athletic_sections: 5 # HHSAA island leagues (OIA, ILH, BIIF, MIL, KIF)

concepts:
  state:
    local_name: Hawaii
    has_active_government: true
    default_body_name: State Legislature
    executive_title: Governor
    subdivisions: Counties

  # the only local government layer in the state — no municipalities exist
  # beneath it. Kalawao is a special county with no functioning government
  # of its own (the state Dept. of Health's director also serves as its
  # mayor); every other county has a directly elected Mayor and Council
  county:
    local_name: County
    has_active_government: true
    default_body_name: County Council
    executive_title: Mayor
    executive_required: false
    subdivisions: false
    legislative_committees: true
    committees_label: Committees

  school_district:
    local_name: Hawaii State Department of Education
    has_active_government: true
    default_body_name: Board of Education

  scholastic_athletic_region:
    local_name: League
    parent_org_name: HHSAA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Circuit
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    status: no live Hawaii-native county-boundary polygon layer found
      (geodata.hawaii.gov's AdminBnd service only has congressional/
      legislative/judicial/council-district/school layers, zero
      county-boundary layer)
    fallback: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1
      (Census TIGERweb, filter STATE='15') — verified all 5 expected
      counties (Honolulu 15003, Kalawao 15005, Kauai 15007, Maui 15009,
      Hawaii 15001).

  municipalities:
    status: confirmed no municipal layer exists, because no incorporated
      municipality below the county level exists in Hawaii law
    note: geodata.hawaii.gov's AdminBnd service only has county council-
      district layers (Honolulu, Maui, Hawaii — Kauai's council is unicameral
      under the county itself, and Kalawao has no elected government at
      all). The 4 governed counties are the only sub-state entities
      relevant to municipality-style ingestion.

  school_districts:
    url: https://geodata.hawaii.gov/arcgis/rest/services/Infrastructure/MapServer/7
    provider: Hawaii State Dept of Education (public schools layer, mirrored
      at opendata.hawaii.gov/dataset/public-schools1)
    type: ArcGIS REST MapServer — also offers CSV/GeoJSON/Shapefile/KML
      downloads and WFS/WMS
    note: verified live. This is a single statewide school list, consistent
      with Hawaii being the only state with one statewide district rather
      than local districts.

  educational_region:
    status: not applicable — a single statewide district makes a
      multi-district cooperative layer structurally impossible
    note: HIDOE's internal "School Complex Areas" sub-district
      administrative layer exists (geodata.hawaii.gov/.../AdminBnd/MapServer/16,
      field COMPLEX_AREA) but these are administrative groupings within the
      single district, not separate governmental entities — likely out of
      scope for jurisdiction ingestion.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
