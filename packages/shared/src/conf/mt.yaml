# Montana locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in MT's own
# vocabulary and structure; notes below cover only what's MT-specific.
#
# `educational_region` is intentionally absent: no BOCES-equivalent regional
# agency was confirmed for Montana.

profile:
  code: US-MT
  name: Montana
  config:
    judicial_regions: 22 # judicial districts
    athletic_sections: 4 # MHSA classes (AA/A/B/C, plus 8-Man football)

concepts:
  state:
    local_name: Montana
    has_active_government: true
    default_body_name: Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Billings, Missoula, Great Falls, Bozeman]

  county:
    local_name: County
    has_active_government: true
    default_body_name: Board of County Commissioners
    subdivisions: Cities, Towns
    legislative_committees: true
    committees_label: Committees

  # a real, distinct legal category from `town` — split further into
  # first/second/third-class cities by population
  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    governance: strong-mayor
    subdivisions: false

  town:
    local_name: Town
    has_active_government: true
    default_body_name: Town Council
    executive_required: false
    legislative_committees: false

  # MT runs separate elementary and high school districts, often
  # coterminous and sharing the same elected Board of Trustees
  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: Board of Trustees

  # sport-specific numbered districts (e.g. "District 6-B") sit within each
  # class; some classes also split into geographic divisions
  scholastic_athletic_region:
    local_name: District
    parent_org_name: MHSA
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://gisservice.mt.gov/arcgis/rest/services/msdi_administrative_boundaries_map_v1/MapServer/8
    provider: Montana State Library / MSDI (Montana Spatial Data Infrastructure)
    type: ArcGIS REST MapServer, layer "County"
    note: verified 56 counties, exact match. The old host gisservicemt.gov
      now redirects — use gisservice.mt.gov.

  municipalities:
    url: https://gisservice.mt.gov/arcgis/rest/services/msdi_administrative_boundaries_map_v1/MapServer/3
    provider: same MSDI host, layer "Incorporated Cities and Towns"
    type: ArcGIS REST MapServer
    field_mapping:
      NAME: name
      TYPE: concept_id (City/Town)
      COUNTY: parent county
      (FIPS field): jurisdiction_identifiers (scheme "census_geoid")
    note: verified 127 records.

  school_districts:
    url: https://gisservice.mt.gov/arcgis/rest/services/msdi_administrative_boundaries_map_v1/MapServer/
    provider: same MSDI host, co-maintained with Montana OPI — three
      separate layers for MT's distinct district types
    field_mapping:
      layer 4 "Secondary School Districts": 97 verified
      layer 5 "Elementary School Districts": 233 verified
      layer 6 "Unified (K-12) School Districts": 65 verified
    note: 97+233+65 = 395, matching the expected ~400 combined figure.
      Corresponding boundary-line-only layers exist at 64/65/66.

  educational_region:
    status: confirmed none — Montana OPI provides regional support/
      accreditation services, but no chartered intermediate agency layer
      exists in the MSDI framework.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
