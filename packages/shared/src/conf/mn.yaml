# Minnesota locale pack. See ny.yaml for the field-by-field doc comment
# (profile/config, concepts, governance) — this file just fills in MN's own
# vocabulary and structure; notes below cover only what's MN-specific.
#
# `village` is intentionally absent: Minnesota abolished the category,
# converting all villages to statutory cities by the early 1970s.

profile:
  code: US-MN
  name: Minnesota
  config:
    judicial_regions: 10 # judicial districts, covering all 87 counties
    athletic_sections: 8 # MSHSL sections per class (reviewed every 2 years)
    school_districts: 9 # regional Service Cooperatives

concepts:
  state:
    local_name: Minnesota
    has_active_government: true
    default_body_name: Legislature
    executive_title: Governor
    subdivisions: Counties
    additional_subdivisions:
      major_cities: [Minneapolis, Saint Paul, Rochester, Duluth, Bloomington]

  county:
    local_name: County
    has_active_government: true
    default_body_name: County Board
    executive_required: false
    # optional statutory forms (elected executive, county manager) exist
    # under Minn. Stat. Ch. 375A, but no county currently uses an elected
    # executive — most run an appointed county administrator instead
    subdivisions: Cities, Townships
    legislative_committees: true
    committees_label: Committees

  city:
    local_name: City
    has_active_government: true
    default_body_name: City Council
    executive_title: Mayor
    governance: [strong-mayor, council-manager]
    # Minneapolis's 2021 charter gives the mayor sole department oversight,
    # though weaker than a classic strong-mayor system; St. Paul has used a
    # strong mayor-council system since 1970
    governance_exceptions:
      strong-mayor: [Minneapolis, Saint Paul]
    subdivisions: false

  # active general-purpose civil governments (some reclassified as "urban
  # townships" near large cities); no single elected township executive
  town:
    local_name: Township
    has_active_government: true
    default_body_name: Town Board
    subdivisions: false

  school_district:
    local_name: School District
    has_active_government: true
    default_body_name: School Board

  educational_region:
    local_name: Service Cooperative
    has_active_government: true
    default_body_name: Cooperative Board

  scholastic_athletic_region:
    local_name: Section
    parent_org_name: MSHSL
    has_active_government: false

  state_house_district:
    local_name: House District
    local_abbrev: HD
    has_active_government: false

  state_senate_district:
    local_name: Senate District
    local_abbrev: SD
    has_active_government: false

  us_house_district:
    local_name: Congressional District
    local_abbrev: CD
    has_active_government: false

  judicial_region:
    local_name: Judicial District
    has_active_government: false

  special_district:
    local_name: Special District
    has_active_government: true

governance:
  council-manager:
    legislative_committees: false
    legislative_districts: false

  strong-mayor:
    legislative_committees: true
    committees_label: Committees

# Documentary only (see profile.ts's StateProfile.sources comment and
# ny.yaml's sources block for the field shape). Verified live against the
# actual endpoints, not recalled from memory.
sources:
  counties:
    url: https://feat.gisdata.mn.gov/arcgis/rest/services/MnGeo/mn_counties/FeatureServer/0
    provider: MnGeo (Minnesota Geospatial Information Office)
    type: ArcGIS REST FeatureServer
    field_mapping:
      county_name: name
      county_code: attributes.mn_county_code
      county_fips55_co: attributes.county_fips
    note: verified 87 counties, exact match.

  municipalities:
    url: https://feat.gisdata.mn.gov/arcgis/rest/services/MnGeo/CTU/FeatureServer/0
    provider: same MnGeo host, "City, Township, Unorganized Territory" (CTU) layer
    type: ArcGIS REST FeatureServer
    field_mapping:
      feature_name: name
      ctu_class: concept_id — distinguishes CITY / TOWNSHIP / UNORGANIZED
        TERRITORY (correctly reflects that MN villages no longer exist)
      county_name / county_code: parent county
      population: attributes.population_estimate (see population below)
    note: schema confirmed live; a CITY-only filter returned 906, which is
      plausibly inflated by imprecise query filtering — re-verify the exact
      city-only count with a cleaner query before relying on it downstream.

  school_districts:
    url: https://enterprise.gisdata.mn.gov/aghost/rest/services/us_mn_state_mde/bdry_school_district_boundaries/FeatureServer/0
    provider: Minnesota Dept of Education (MDE)
    type: ArcGIS REST FeatureServer
    field_mapping:
      prefname (or shortname): name
      sdorgid / sdnumber: jurisdiction_identifiers (scheme "mn_sdorgid")
      sdtype: concept_id
      web_url: website
    note: verified 329 districts (matches the ~330 expected).

  educational_region:
    status: no API or GIS source — directory only
    note: 9 Service Cooperatives confirmed live via mnservcoop.org
      (BrightWorks, Lakes Country, Northeast, Northwest, Resource Training &
      Solutions, Sourcewell, South Central, Southeast, SWWC), each with
      name/city/website, but no machine-readable boundary/list source exists
      for the regions themselves.

  population:
    status: not yet ingested
    recommended_source: US Census Bureau Population Estimates Program (PEP) —
      https://api.census.gov/data/{year}/pep/population — joins on the county
      FIPS from the counties source above.
